l_english:
 # ---------- Missile airframe (draft) ----------
 # Slot labels are NOT overridden here on purpose. The airframe reuses vanilla
 # plane slots, so it should read the way the rest of the air designer reads.
 cwic_missile_design_bureau:0 "Missile Design Bureau"
 cwic_missile_design_bureau_desc:0 "A team that does nothing but build things that fly once."

 cwic_missile_warhead:0 "Missile Warhead"
 cwic_missile_warhead_desc:0 "A bomb that arrives on its own. Heavier on target than anything a bomb bay carries, and it costs range."
 cwic_solid_rocket_motor:0 "Solid Rocket Motor"
 cwic_solid_rocket_motor_desc:0 "Stores in a tube for years and launches in minutes. Fast, dependable, short-legged."
 cwic_inertial_guidance:0 "Inertial Guidance"
 cwic_inertial_guidance_desc:0 "No operator, no radio to jam, no weather. It knows where it started and how fast it has gone - and that is all it knows."

 # ---------- Missile Design folder ----------
 cwic_missile_folder:0 "Missile Design"
 cwic_srbm_design:0 "Short-Range Ballistic Missile"
 cwic_srbm_design_desc:0 "The battlefield weapon. Everybody builds it first because everybody can."
 cwic_irbm_design:0 "Intermediate-Range Ballistic Missile"
 cwic_irbm_design_desc:0 "Reaches the other side of a theatre, which in Europe means everything."
 cwic_icbm_design:0 "Intercontinental Ballistic Missile"
 cwic_icbm_design_desc:0 "Thirty minutes from one hemisphere to the other. This is what a superpower is."
 cwic_slbm_design:0 "Submarine-Launched Ballistic Missile"
 cwic_slbm_design_desc:0 "It cannot be found, so it cannot be destroyed first. That is the entire argument."
 cwic_missile_warheads:0 "Missile Warheads"
 cwic_missile_warheads_desc:0 "A bomb that arrives on its own needs a different case to one that is dropped."
 cwic_missile_heavy_warhead:0 "Heavy Warheads"
 cwic_missile_heavy_warhead_desc:0 "Twice the charge, most of the range. There is no third option."
 cwic_missile_inertial_guidance:0 "Inertial Guidance"
 cwic_missile_inertial_guidance_desc:0 "Gyroscopes and accelerometers. It cannot be jammed because there is nothing to jam."
 cwic_missile_terrain_guidance:0 "Terrain Matching"
 cwic_missile_terrain_guidance_desc:0 "It reads the ground against a stored map. This is what turned a missile from an area weapon into an aimed one."
 cwic_missile_solid_fuel:0 "Solid Propellant"
 cwic_missile_solid_fuel_desc:0 "A missile that sits in a tube for a decade and launches in minutes, instead of one that needs a fuelling crew and an hour."
 cwic_missile_staging:0 "Staged Boosters"
 cwic_missile_staging_desc:0 "Throw away the engine once it is empty. The only way to reach the other hemisphere."
 cwic_missile_light_airframe:0 "Lightweight Airframe"
 cwic_missile_light_airframe_desc:0 "Further and faster, and nothing left over to survive an interception."
 cwic_missile_hardened_airframe:0 "Hardened Airframe"
 cwic_missile_hardened_airframe_desc:0 "Built to arrive through something that is shooting at it."
 cwic_terrain_guidance:0 "Terrain Matching Guidance"
 cwic_terrain_guidance_desc:0 "Reads the ground against a stored map in the final stretch."
 cwic_staged_booster:0 "Staged Booster"
 cwic_staged_booster_desc:0 "Range at the cost of everything else — mass, speed off the pad, and a great deal of money."
 cwic_light_airframe:0 "Lightweight Airframe"
 cwic_light_airframe_desc:0 "Thinner skin, more range, less of it arrives if anyone shoots."
 cwic_hardened_airframe:0 "Hardened Airframe"
 cwic_hardened_airframe_desc:0 "Heavier, shorter-legged, and it gets there."

