 VIE_Development_Scheme: "The Development Scheme of Vietnam"
 VIE_Development_Scheme_desc: "Ever since our recent independence thanks to the Bao-Dai solution, our country's economy is still heavily backwards and mostly exploited due to centuries of feudal and colonial rule. However, there is, albeit outdated or war-torn, colonial infrastructure and small industrial zones that we can repurpose and serve as a foundation for the ongoing modernization and industrialization of our great country!"
