 VIE_Diem_No_Cung_tt: "§RKieu-Cong-Cung has not crossed over; the programme runs without him§!"
 VIE_Diem_Cung_Civic_Action_tt: "§YKieu-Cong-Cung§! takes charge of the civic action cadres"
