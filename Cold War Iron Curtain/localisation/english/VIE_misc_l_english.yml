 # === Border Settlement ===

 # --- Decision category ---
 VIE_Border_Settlement: "The Frontier Question"

 # --- Decisions ---
 VIE_Border_Table_Demand: "Table a Frontier Demand"
 VIE_Border_Table_Demand_desc: "Deliver a formal note to the government concerned, setting out our historical title to the province and inviting them to settle the matter by agreement. They may prefer to keep the province.\n\n§YSvay Rieng§! may be demanded at once - the claim has stood since the Elysee Accords. §YTran-Ninh§! and §YHouaphanh§! require that we pressed our historical claim to Tran-Ninh. §YPhongsaly§! is only arguable once Tran-Ninh is ours and we hold the approaches to it."
 VIE_Border_Provoke_Incidents: "Provoke Border Incidents"
 VIE_Border_Provoke_Incidents_desc: "Patrols that stray. Customs posts that move a kilometre overnight. Villagers who discover they have been paying the wrong government's taxes. None of it is war, and all of it is pressure. The more of it they endure, the likelier they are to come to the table - and the likelier the whole frontier is to catch fire."
 VIE_Border_Renewed_Demand: "Renew the Demand"
 VIE_Border_Renewed_Demand_desc: "Put the note a second time, to a government that has spent months watching its frontier posts burn. The arguments have not changed. Their appetite for the argument has."
 VIE_Border_Punitive_Clash: "Launch a Punitive Clash"
 VIE_Border_Punitive_Clash_desc: "Send the army across the line in strength, take the disputed districts, and present the settlement as a fact. It is not a war and nobody will call it one, but men will die over it and the world will watch how it ends."
 VIE_Border_Fabricate_Frontier_Casus_Belli: "Fabricate a Frontier Casus Belli"
 VIE_Border_Fabricate_Frontier_Casus_Belli_desc: "The clash failed and the province is still theirs. There is one instrument left: build the legal case, publish the atrocity, and take the province in a war we declare openly. Washington and Paris will both have something to say about it."
 VIE_Border_Renounce_Claims: "Renounce the Claim"
 VIE_Border_Renounce_Claims_desc: "Withdraw the note, drop the claim and let the line stand where the French drew it. We gain a neighbour who will speak to us and lose an argument we were never certain of winning."

 # --- Trigger tooltips ---
 VIE_indochina_war_won_trigger_TT: "§YThe First Indochina War has ended on terms favourable to us§! - the North has been absorbed, or the accords were signed with Saigon in the stronger position"
 VIE_can_press_border_claims_trigger_TT: "§YWe are a sovereign state, at peace, with the frontier question open§!"
 VIE_border_election_pending_block_tt: "§YNo all-Vietnam ballot is pending§! - we will not open a frontier quarrel with the very state we are about to go to the polls beside"
 VIE_border_target_not_french_subject_TT: "§YThe owner is not a French subject§! - we do not press claims against fellow members of the Union"
 VIE_border_target_adjacent_TT: "§YThe province borders territory we own and control§!"
 VIE_border_tranninh_claimed_TT: "§YWe pressed our historical claim to Tran-Ninh§!"
 VIE_border_clash_force_TT: "§YOur troops already occupy the province, or we hold a state bordering it - ours, free of border fighting and garrisoned with at least one division§! - from which to mount the operation"
 VIE_border_no_clash_tt: "§RNo clash can be mounted§! - we need a state we own and control bordering the province, garrisoned with at least one division"
 VIE_border_clash_running_tt: "§YNo punitive operation is under way§! - the frontier question waits until the shooting on it has stopped"
 VIE_border_demand_pending_tt: "§YNo note is awaiting a reply§! - we will not put two demands to two governments at once"
 VIE_frontier_gained_TT: "§YWe hold at least one of the disputed frontier provinces§!"

 # --- Effect tooltips ---
 VIE_border_demand_sent_tt: "§YA formal note is delivered to the government concerned§!, setting out our title to the province. Their reply is expected within the month; if none comes, the silence will be read as a refusal."
 VIE_border_incidents_begun_tt: "§YThe frontier campaign runs for 14 days§!, after which the pressure on the province is assessed and the border command reports what it cost us."
 VIE_border_clash_launch_tt: "§YThe army moves on the province in strength.§! Where the ground is still theirs the operation is fought out as a border clash; where our garrison already stands on it, the province is simply kept. Either way Saigon will be marked a §Rregional aggressor§! and the affair will raise world tension."
 VIE_border_cb_fabricated_tt: "§YThe legal case is published and a war goal is prepared against the owner of the province.§! Washington and Paris will both have something to say about it."

 # --- World tension reasons ---
 VIE_border_clash_threat: "Vietnamese punitive operation on the frontier"
 VIE_border_casus_belli_threat: "Vietnamese designs on its neighbours"

 # --- Ideas ---
 VIE_Regional_Aggressor: "Regional Aggressor"
 VIE_Regional_Aggressor_desc: "Saigon has stopped pretending its frontier claims are a legal matter. The capitals of Southeast Asia have noticed, and so have the powers who fund us."
 VIE_Regional_Hegemon: "Master of the Frontier"
 VIE_Regional_Hegemon_desc: "We took what we said was ours and nobody stopped us. The army has never been more confident, and our neighbours have never been more careful."
 VIE_Chastened_Frontier: "A Frontier Left Alone"
 VIE_Chastened_Frontier_desc: "The claims were dropped before they cost anyone their life. It reads as weakness in some quarters and as statesmanship in others, and the border districts are quiet."
 VIE_Diem_Hinh_Already_Won_tt: "§RGeneral Hinh already holds the state§!"
 VIE_Diem_Hinh_Already_Settled_tt: "The question of the §YGeneral Staff§! has already been settled"
 VIE_Diem_Controls_Army_tt: "The premier commands the §YNational Army§!"
 VIE_Diem_Cao_Dai_Settled_tt: "§RThe Cao-Dai question is already settled§!"
 VIE_Diem_Hoa_Hao_Settled_tt: "§RThe Hoa-Hao question is already settled§!"
 VIE_Diem_Binh_Xuyen_Settled_tt: "§RThe Binh-Xuyen question is already settled§!"
 VIE_Referendum_Score_tt: "Tally the referendum against the standing of the §Ypremiership§! and the §Ythrone§!, national §Yinfluence§!, the loyalty of the §Ysects§!, control of the §Yarmy§!, the resettled §Yrefugees§!, the §YNational Revolutionary Committee§!, and American backing"
 VIE_Diem_Loyalist_Officer_Corps: "Loyalist Officer Corps"
 VIE_Diem_Loyalist_Officer_Corps_desc: "The men who held French commissions are gone, and the men who replaced them owe their rank to the premier personally. The army is less experienced than it was and far more certain whose orders it takes."

# === Diem premiership additions ===
 VIE_Hinh_Standoff_Adj_tt: "Will Adjust the §CStandoff with General Hinh§! by [?hinh_standoff_change|Y+0]."
 VIE_DaiViet_Threat_Adj_tt: "Will Adjust §CDai-Viet Conspiracy§! by [?daiviet_threat_change|Y+0]."
 VIE_Hinh_Standoff_tt: "Our §Ystanding against General Hinh§! must be §Gabove 24§! (currently §Y[?VIE_Hinh_Standoff|0]§!)"
 VIE_Hinh_Break_Requirement_tt: "Our §Ystanding against General Hinh§! must be §Gabove 49§! (currently §Y[?VIE_Hinh_Standoff|0]§!)"
 VIE_DaiViet_Threat_Contained_tt: "§CDai-Viet Conspiracy§! Must Fall §GBelow§! §Y50§! (currently §Y[?VIE_DaiViet_Threat|0]§!)"
 VIE_binh_xuyen_rung_sac_tt: "The §YBinh-Xuyen§! are driven out of Saigon and Cholon into the §YRung-Sac§!, but they are not destroyed"
 VIE_Diem_Binh_Xuyen_At_Rung_Sac_tt: "The §YBinh-Xuyen§! must have been §Ydriven into the Rung-Sac§!"
 VIE_Diem_Crown_Domain_Gone_tt: "§RThe Domain of the Crown is already gone§!"
 VIE_Diem_Sects_All_Settled_tt: "§RThere is no sect left to cut off§!"
 VIE_Diem_Ba_Long_Cleared_tt: "§RThe Ba-Long war zone is already gone§!"
 VIE_Diem_Throne_Already_Gone_tt: "§RThere is no throne left to disarm§!"
 VIE_Diem_Immediate_Ballot_tt: "The settlement scheduled the ballot §Yimmediately§! - it will be counted long before July 1955, so the refusal cannot wait for it"
 VIE_Diem_No_North_To_Refuse_tt: "§RThere is no northern government to hold a vote with§!"
 VIE_50s_content_end_tt: "§GThis is the end of content for the State of Vietnam as for now. Thank you for playing and stay tuned on our Discord for updates and progress reports!§!"
 VIE_summary_republic_tt: "§YThe Republic of Vietnam§! was proclaimed, and Ngo-Dinh-Diem is its President"
 VIE_summary_junta_tt: "§YGeneral Nguyen-Van-Hinh§! took the state, and Paris kept the ministries that matter"
 VIE_summary_throne_tt: "§YBao-Dai§! remains Chief of State, and the premiership remains a revolving door"
 VIE_summary_throne_confirmed_tt: "The October plebiscite was held with no candidate standing against the throne, and confirmed Bao-Dai as Chief of State."
 VIE_summary_hinh_exiled_tt: "§YGeneral Hinh§! was broken and died a French citizen in Paris"
 VIE_summary_hinh_bought_tt: "§YGeneral Hinh§! was bought rather than beaten, and the army was never truly ours"
 VIE_summary_can_lao_tt: "The §YCan-Lao§! holds the ministries, the officer corps and the provinces"
 VIE_summary_hoang_dieu_tt: "The §YBinh-Xuyen§! were hunted to destruction in the Rung-Sac"
 VIE_summary_rung_sac_tt: "The §YBinh-Xuyen§! still hold the Rung-Sac, and Le-Van-Vien still has money"
 VIE_summary_ba_long_tt: "The §YDai-Viet war zone at Ba-Long§! was broken up"
 VIE_summary_royal_guard_tt: "The §YRoyal Guard§! was abolished and folded into the National Army"
 VIE_summary_decree_21_tt: "§YDu-So 21§! ended the Domain of the Crown"
 VIE_summary_reject_geneva_tt: "The §Yall-Vietnam reunification election§! was publicly refused"
 VIE_Can_Lao_Party: "The Can-Lao Party"
 VIE_Can_Lao_Party_desc: "The Personalist Labour Revolutionary Party recruits in cells of five, by invitation, and no cell is told the names of the others. It is present in the ministries and the officer corps long before it is present at any election, and it answers to the premier's brother."
 VIE_Caretaker_Cabinet: "Caretaker Cabinet"
 VIE_Caretaker_Cabinet_desc: "Fifteen of the eighteen ministers resigned together and have not been replaced. The clerks still open the ministries in the morning; nothing is decided in them."
 VIE_Hinh_Coup_Attempt: "The Chief of Staff's Ambition"
 VIE_Hinh_Coup_Attempt_desc: "General Nguyen-Van-Hinh has armoured cars at the palace gates, a French passport in his pocket and a standing offer to be rid of the premier by telephone. The government cannot dismiss him and cannot ignore him. It can only build enough of a base - refugees, money, a party, American guards - that the call is not worth making, and then break him with the Break General Hinh focus. If the clock runs out first, the generals take the state."
 VIE_Hinh_Request_American_Guards: "Ask Manila for a Guard Detail"
 VIE_Hinh_Request_American_Guards_desc: "Colonel Lansdale will put the question to President Magsaysay directly. What comes back is four Filipino officers, a training programme, and a palace guard that owes the National Army nothing."
 VIE_Hinh_Request_American_Guards_effect: "Increases our §Ystanding against General Hinh§! by §G25§! after two weeks."
 VIE_Hinh_Buy_the_Officer_Corps: "Buy the Officer Corps"
 VIE_Hinh_Buy_the_Officer_Corps_desc: "Back pay, promotions and quiet arrangements with battalion commanders who have not yet decided which way to go. It is not loyalty and it does not last, but it does not have to last long."
 VIE_Hinh_Buy_the_Officer_Corps_cost: "§Y25§! Political Power and §Y0.1§! Million"
 VIE_Hinh_Buy_the_Officer_Corps_effect: "Increases our §Ystanding against General Hinh§! by §G10§!."
 VIE_Hinh_Appeal_to_Bao_Dai: "Appeal to the Chief of State"
 VIE_Hinh_Appeal_to_Bao_Dai_desc: "The general wired Cannes for intervention and did not get it. We can wire Cannes ourselves, and we will get it, because the throne would rather have a premier it can dismiss than a general it cannot. The favour will be remembered and invoiced."
 VIE_Hinh_Appeal_to_Bao_Dai_effect: "Increases our §Ystanding against General Hinh§! by §G20§!, and the §Ythrone's§! standing with it."
 VIE_Hinh_Reform_the_Cabinet: "Re-Form the Government"
 VIE_Hinh_Reform_the_Cabinet_desc: "Fill the fifteen empty ministries from the refugee associations, the Catholic north and the exile circles. None of them are experienced. All of them owe their seats to one man."
 VIE_Hinh_Reform_the_Cabinet_effect: "Removes the §YCaretaker Cabinet§! and increases our §Ystanding against General Hinh§! by §G10§!."
 VIE_Hinh_Ease_Out_the_Chief: "Ease Out the Chief of Staff"
 VIE_Hinh_Ease_Out_the_Chief_desc: "The general was bought, not beaten, and he still signs the orders. There is a slower way. Move Le-Van-Ty into the General Staff a department at a time, transfer the men who answer to Hinh to commands that do not matter, and let the arrangement expire of its own accord. The throne will understand exactly what is being done and will not forgive it."
 VIE_Hinh_Ease_Out_the_Chief_effect: "After §Y30§! days the premier commands the §YNational Army§!. Costs the §Ythrone's§! standing and feeds the §RDai-Viet conspiracy§!."
 VIE_DaiViet_Plot: "A Dai-Viet Conspiracy"
 VIE_DaiViet_Plot_desc: "The Dai-Viet Quoc-Dan-Dang were plotting against the French before this government existed and regard the present arrangement as an interruption. Something is being prepared in the garrisons. Bringing the conspiracy back under fifty will stop it; letting it run will not."
 VIE_DaiViet_Offer_Cabinet_Seats: "Offer the Dai-Viet Cabinet Seats"
 VIE_DaiViet_Offer_Cabinet_Seats_desc: "Two ministries and a province, on the understanding that the party stops recruiting inside the officer corps. It buys quiet, and it tells everyone in Saigon that plotting is a route to office."
 VIE_DaiViet_Offer_Cabinet_Seats_effect: "Reduces the §CDai-Viet Conspiracy§! by §G25§! and our §Yown standing§! by §R5§!."
 VIE_DaiViet_Can_Lao_Infiltration: "Turn the Can-Lao Loose on Them"
 VIE_DaiViet_Can_Lao_Infiltration_desc: "The party recruits out of the same nationalist pool the Dai-Viet draw on, in the same provinces, using the same language. It is very much cheaper to know what a conspiracy is doing than to arrest it afterwards."
 VIE_DaiViet_Can_Lao_Infiltration_effect: "Reduces the §CDai-Viet Conspiracy§! by §G20§!."
 VIE_DaiViet_Arrest_the_Cadres: "Arrest the Cadres"
 VIE_DaiViet_Arrest_the_Cadres_desc: "Take the province committees at four in the morning and hold them without charge while the interrogations run. It works. It also confirms, in public and in the Dai-Viet's own words, everything the party has been saying about this government."
 VIE_DaiViet_Arrest_the_Cadres_effect: "Reduces the §CDai-Viet Conspiracy§! by §G35§! at a cost to §Rstability§!."

 #The premiership situation report - display-only decision VIE_Diem_Situation_Report
 VIE_Diem_Situation_Report: "Situation Report"
 VIE_Diem_Situation_Report_desc: "A standing summary of where the government actually stands: the throne against the premiership, the influence balance with Paris, the sects, and - while Ngo-Dinh-Diem holds the premiership - the Hinh standoff, the Dai-Viet conspiracy and what the October referendum would return if it were held today. Reading costs nothing and changes nothing."
