 VIE_cuongde_dan_quoc_armed_tt: "A negotiated §YDan-Quoc Peace§! between Diem and Ho becomes a possible resolution of the §YIndochina Struggle§!"
 VIE_cuongde_failure_branch_tt: "The §YA House Divided§! focus branch becomes available"
