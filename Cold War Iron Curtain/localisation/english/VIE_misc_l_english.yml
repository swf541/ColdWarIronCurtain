 VIE_CrownDomain_Decisions: "The Crown Domains"
 VIE_CrownDomain_Decisions_desc: "The Hoang-Trieu Cuong-Tho, or the Crown Domains, remain under Bao-Dai's personal authority, apart from the Vietnamese state. Their fate is ours to decide."
 VIE_Annex_FUL: "Dissolve the Montagnard Crown Domain"
 VIE_Annex_FUL_desc: "The Crown Domain of the Central Highlands has outlived its purpose. It is time to bring the Montagnard Country under direct Vietnamese administration."
 VIE_Annex_CCC: "Reclaim Cochinchina"
 VIE_Annex_CCC_desc: "The autonomous government in Saigon has failed. Cochinchina will be folded back into Vietnam without further ceremony."
 VIE_Puppet_NUN: "Open the Nung Settlement"
 VIE_Puppet_NUN_desc: "The Nung of Hai-Ninh guard our northern frontier. They may keep their local privileges, but their territory must answer to us."
 VIE_Pau_Treaty_command_tt: "The §YState of Vietnam§! gains associated-state standing within the southern command; CEFEO retains the northern crown domains"
 VIE_Matignon_Treaty_command_tt: "The §YState of Vietnam§! ends its political dependency on Paris without leaving the French Indochina theatre command"

