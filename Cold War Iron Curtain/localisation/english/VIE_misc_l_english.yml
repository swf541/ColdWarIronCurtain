 VIE_cuongde_outcome_geneva_tt: "The powers are seated in §YGeneva§!: the accord becomes negotiating capital toward a settlement between the two Vietnams"
 VIE_cuongde_outcome_armistice_tt: "An armistice takes hold between §YNorth§! and §YSouth§!; the unification process will conclude in §Y180 days§! if Diem and Ho still lead their governments"
 VIE_cuongde_outcome_postwar_tt: "With the war already over, the accord becomes a reunification bid between two states at peace, concluding in §Y180 days§!"
