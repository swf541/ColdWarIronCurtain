 # === Diem in the Cuong-De Route ===
 VIE_disorganized_land_ownership: "Disorganized Land Ownership"
 VIE_disorganized_land_ownership_desc: "Southern Vietnam's agrarian economy remains deeply unequal after decades of colonial rule. Vast estates dominate the fertile Mekong Delta, with roughly 2.5% of landlords owning nearly 45% of all farmland, while 73% of smallholders share only around 15%. In provinces such as Bac Lieu, inequality is even more severe, where a handful of landlords control the overwhelming majority of arable land and most peasants own none at all. Large foreign-owned plantations, including French enterprises such as the Domaine Agricole de l'Ouest, continue to control tens of thousands of hectares. This concentration of land ownership fuels rural poverty, social tensions, and growing calls for comprehensive agrarian reform."
