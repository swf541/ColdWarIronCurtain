 VIE_Nhu_Political_Counsellor: "Counsellor Ngo-Dinh-Nhu"
 VIE_Nhu_Political_Counsellor_desc: "The premier's brother holds no ministry and answers to no assembly. He runs the files, the party and the men who watch the party, and he does it from a room in the Gia-Long Palace that appears on no organisation chart."
 VIE_Phu_Tong_Uy_Di_Cu: "General Commissariat for Refugees"
 VIE_Phu_Tong_Uy_Di_Cu_desc: "Built to move a hundred thousand northerners and asked to move nearly a million. It has lorries, camps, land grants and its own men in every province, and it is the only arm of this government that the countryside has actually met."
 VIE_Phong_Trao_Cach_Mang_Quoc_Gia: "National Revolutionary Movement"
 VIE_Phong_Trao_Cach_Mang_Quoc_Gia_desc: "A front rather than a party: Catholics, refugees, unionists and defectors under one banner, capable of filling a provincial square at three days notice, and named closely enough after the premier that the distinction is academic."
 VIE_Cach_Mang_Quoc_Gia_Press: "The Cach-Mang Quoc-Gia Press"
 VIE_Cach_Mang_Quoc_Gia_Press_desc: "The information ministry now licenses the French dailies and the elite reviews, and the movement prints a paper of its own in every provincial capital. The opposition has not been silenced so much as buried under newsprint."
 VIE_Dac_Phu_Cong_Dan_Vu: "Special Commissariat for Civil Action"
 VIE_Dac_Phu_Cong_Dan_Vu_desc: "Cadres in black pyjamas who live where they are posted, dig the well, teach the school and file the report. It is the method that beat the French, run the other way, and it is the only one that has ever worked in the delta."
 VIE_Quan_Luc_VNCH: "Army of the Republic of Vietnam"
 VIE_Quan_Luc_VNCH_desc: "New colours, a new oath and the same men in the same barracks. What has changed is that the thing they swear to is a state, and that the general staff owes its stars to the palace."
 VIE_SITREP_CABINET_YES:0 "  §G+10§! The second cabinet is seated"
 VIE_SITREP_CABINET_NO:0 "  §R  0§! The government has not been re-formed since 1954"
