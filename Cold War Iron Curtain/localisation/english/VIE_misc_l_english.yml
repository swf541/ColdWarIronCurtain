 VIE_SITREP_ESTATE_NO:0 "  §R  0§! Hue and the imperial accounts remain the throne's"
 VIE_SITREP_FRONT_YES:0 "  §G+10§! The National Unified Front is dissolved"
 VIE_SITREP_FRONT_NO:0 "  §R  0§! The sect front has not been broken up"
