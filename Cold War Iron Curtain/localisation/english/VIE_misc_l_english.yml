 VIE_Marxist_Organization: "Marxist Organization"
 VIE_Marxist_Organization_desc: "The Personalist Revolution need not fear the methods of its enemies. Under the direction of Advisor Ngo-Dinh-Nhu, the party shall study and adopt the organizational discipline of Marxism-Leninism - cells, cadres, criticism - while rejecting its materialist soul."
 VIE_Organize_Party_Cells: "Organize Party Cells"
 VIE_Organize_Party_Cells_desc: "The Can-Lao model: organize the party into small, disciplined cells embedded in every village, factory and barracks. Each cell answers upward; none knows the full network."
 VIE_Introduce_Democratic_Centralism: "Introduce Democratic Centralism"
 VIE_Introduce_Democratic_Centralism_desc: "Freedom of discussion, unity of action. Once the party line is set, every cadre shall carry it out without hesitation - a discipline our enemies have long mastered."
 VIE_Vanguard_NhanVi_Revolution: "A Vanguard for the Nhan-Vi Revolution"
 VIE_Vanguard_NhanVi_Revolution_desc: "The party is no longer a mere electoral machine but a vanguard: an elite of tested cadres who lead the masses toward the Personalist society from within every institution of the state."
 VIE_Cadres_To_Barracks: "Cadres to the Barracks"
 VIE_Cadres_To_Barracks_desc: "The rehabilitated Viet-Minh veterans of the Chieu-Hoi program know jungle warfare and political soldiering better than any of our instructors. Attach them to our training commands. §Y[?VIE_ChieuHoi_Cadres]§! cadre pools remain."
 VIE_Cadres_To_Villages: "Cadres to the Villages"
 VIE_Cadres_To_Villages_desc: "The rehabilitated cadres organized land redistribution for the Viet-Minh once before - let them do it again, this time under our flag. §Y[?VIE_ChieuHoi_Cadres]§! cadre pools remain."
