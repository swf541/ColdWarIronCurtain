 pol_desc_chanh_quyen_quoc_gia: "With no Prime Minister seated, the business of government falls to the permanent secretaries and the department heads, who continue to sign what must be signed under the collective name of the National Government.\n\nThe Chief of State remains above the arrangement and outside it. He appoints, and until he appoints, this is what governs.\n\nNo caretaker ministry has ever set policy in Saigon, and this one will not either. It exists to keep the machinery turning until the palace settles on a name."

