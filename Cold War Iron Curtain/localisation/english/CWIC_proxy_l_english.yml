l_english:
 # Proxy war escalation. Theatre = the country fought over.

 cwic_proxy.1.t:0 "Foreign Volunteers in [cwic_theatre.GetNameDefCap]"
 cwic_proxy.1.d:0 "[cwic_intervenor.GetFlag] [cwic_intervenor.GetNameDefCap] has men in the field in [cwic_theatre.GetNameDefCap]. They wear no insignia we can point to, and their government calls them volunteers.\n\nOur ambassador is waiting on instructions. We can demand they go home, we can arm the other side and let the thing become a war, or we can decide that [cwic_theatre.GetNameDefCap] is not worth the trouble."
 cwic_proxy.1.a:0 "Demand their withdrawal."
 cwic_proxy.1.b:0 "Arm the other side."
 cwic_proxy.1.c:0 "This is not our fight."

 cwic_proxy.2.t:0 "Demand to Withdraw from [cwic_theatre.GetNameDefCap]"
 cwic_proxy.2.d:0 "A note has been delivered. Our volunteers in [cwic_theatre.GetNameDefCap] are to be withdrawn, and the note does not pretend to be a request.\n\nWe can pull them out and keep the quarrel small. Or we can leave them where they are — and accept that the other side will start shipping rifles to whoever is shooting at them."
 cwic_proxy.2.a:0 "Bring them home."
 cwic_proxy.2.b:0 "They stay."

 cwic_proxy.3.t:0 "They Refuse to Leave [cwic_theatre.GetNameDefCap]"
 cwic_proxy.3.d:0 "The reply is a refusal, politely worded. Their volunteers remain in [cwic_theatre.GetNameDefCap].\n\nThen the restraint was theirs to keep, and they have not kept it. Our own advisors can go where they are needed."
 cwic_proxy.3.a:0 "Then we are free to act."
