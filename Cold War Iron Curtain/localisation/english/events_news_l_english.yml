 saf_news.4.t: "Robert Sobukwe, President of the Pan Africanist Congress, is sentenced to 3 years imprisonment for incitement of black Africans to urge resistance to the Apartheid laws and other recent legislation clamping down on civil liberties, especially in regard to the ANC and other Pro-African groups."
 saf_news.5.t: ""
 saf_news.6.t: ""
 saf_news.7.t: ""
 saf_news.9.t: ""
 saf_news.10.t: ""
 cw_saf.4.d: "After days of unrest, the military has decided to take over in order to restore peace and order to the streets. In a short speech held by the high command, they simply stated \"While not pleasant, we must do this in order to save South Africa from falling completely. We also wish to restore democracy as soon as possible.\""

 news.1600.t: "[GetNewspaperHeader]Perón Deposed by the Argentine Army"
 news.1600.d: "Breaking news are arriving from Argentina of a successful coup d'état against the Peronist government. The coup d'état occurred when members of the Army, Navy and Aeronautics, under the command of retired General Benjamín Menéndez and Eduardo Lonardi, successfully overthrew the government of President Juan Domingo Perón. In their brief proclamation, the rebels accused the government of having led the Nation to "a total bankruptcy of its internal and external credit, both morally and spiritually as well as materially". The restrictions on civil liberties and the actions of political opponents, the constitutional reform that allowed the re-election of the President, as well as the measures to politicise the armed forces seem to have influenced the military adherents to the movement. Despite some disagreements amidst the rebel leadership, the coup was launched during a favourable political moment and was successful, with Peron's current whereabouts being unknown. While the current provisional military dictatorship promised a return to democratic processes, they argue this will only happen when all Peronist influences are removed from all levels of government. It remains to be seen if Argentina will become a democratic nation one day."
 news.1600.a: "A victory for democracy?"
 news.1601.t: "[GetNewspaperHeader]President William Tubman dies, age 75"
 news.1601.d: "William Tubman, the 19th President of Liberia, has passed away today, July 23, 1971, at the age of 75, following complications from a stroke. Tubman’s 27-year rule, while marked by some economic development and modernization, was also characterized by increasing authoritarianism and political repression. Despite claims of progress, his regime often silenced opposition and curtailed political freedoms. His death leaves Liberia grappling with a legacy of Americo-Liberian dominance, a ruling elite that has long maintained control over the country’s political and economic systems. In the wake of his passing, Vice President William Tolbert is set to assume the presidency, with many watching closely to see if he will chart a new course for the country or continue Tubman’s policies."
 news.1601.a: "His party is so popular its one every election since 1878!"
 news.1602.t: "[GetNewspaperHeader]Samuel Doe leads Liberian Coup"
 news.1602.d: "In a stunning turn of events, Samuel Doe, a former soldier, led a military coup in Liberia on April 12, 1980, overthrowing the government of President William Tolbert. The coup, which unfolded in the early hours of the morning, saw Doe and his followers storm the presidential palace, leading to Tolbert's brutal assassination. The coup marks the end of nearly 133 years of Americo-Liberian rule, with Doe, a member of the country's indigenous group, now taking control of the government. The country is left in shock and uncertainty as Liberia enters a new, unpredictable era under military rule."
 news.1602.a: "Is this the end of Americo-Liberian rule?!"
 news.1603.t: "[GetNewspaperHeader]Siad Barre leads Somalian Coup"
 news.1603.d: "In a dramatic shift of power, General Siad Barre has staged a successful coup in Somalia, overthrowing the government of President Abdirashid Ali Shermarke. The coup, led by Barre and the Somali military, took place after Shermarke was assassinated by one of his own bodyguards earlier that day. Barre swiftly took control, dissolving the existing government and declaring Somalia a socialist state. As the country reels from this sudden upheaval, many are left to wonder what the future holds under Barre's leadership and the promises of political and social change that come with this new military regime."
 news.1603.a: "So much turmoil in such a young country"
 news.1604.t: "[GetNewspaperHeader]Siad Barre toppled"
 news.1604.d: "In a dramatic turn of events, General Siad Barre’s nearly 22-year rule in Somalia came to an abrupt end as armed opposition groups launched a final offensive against the capital, Mogadishu. After months of intense fighting between government forces and rebel groups, Barre's regime, weakened by internal divisions and the collapse of support, was overthrown. Barre himself fled the city, and the once-stable government crumbled, leaving Somalia in chaos. The country is now left without a central government, as clan-based militias and warlords vie for control, plunging the nation into a period of anarchy and uncertainty."
 news.1604.a: "Good Riddance!"
 news.1605.t: "[GetNewspaperHeader]Revolution in Ethiopia"
 news.1605.d: "In a stunning and violent turn of events, Ethiopia’s Emperor Haile Selassie has been overthrown in a military coup. After months of growing unrest, strikes, and protests against his rule, the Ethiopian military, led by the Derg (a committee of officers), seized power in a swift operation. Haile Selassie, who had reigned for over 40 years, was deposed and placed under house arrest, marking the end of the centuries-old Ethiopian monarchy. The coup has plunged the nation into uncertainty, with the Derg now in control, promising reforms but also hinting at a more authoritarian regime. As Ethiopia enters a new chapter, the future remains unclear under the rule of this new military-led government."
 news.1605.a: "Chaos!"
 news.1606.t: "[GetNewspaperHeader]Mengistu seizes control of the Derg"
 news.1606.d: "Major Mengistu Haile Mariam has emerged as the leader of Ethiopia following the military coup that deposed Emperor Haile Selassie in September 1974. Quickly consolidating power within the Derg, Mengistu has established a Marxist-Leninist government, promising land reforms while launching a brutal crackdown on opposition. As Ethiopia enters this new era under military rule, the future remains uncertain, with political tension and the threat of further unrest looming over the nation."
 news.1606.a: "The face of Orthodox Marxist-Leninism in Ethiopia"
 news.1607.t: "[GetNewspaperHeader]Declaration of the People's Democratic Republic of Ethiopia"
 news.1607.d: "Major Mengistu Haile Mariam has announced the creation of the People’s Democratic Republic of Ethiopia, officially ushering in a Marxist-Leninist civilian government. Following the overthrow of Emperor Haile Selassie, Mengistu’s regime is promising sweeping reforms, including land redistribution and the nationalization of key industries. However, concerns are growing as the government begins a harsh crackdown on opposition, signaling a more repressive future for the country under its new socialist leadership. The political landscape is shifting, leaving many uncertain about what comes next for Ethiopia."
 news.1607.a: "Finally civilian rule in Ethiopia"
 news.1608.t: "[GetNewspaperHeader]Muammar Gaddafi establishes the Socialist Arab Jamahiriya"
 news.1608.d: "Muammar Gaddafi has declared the birth of the Socialist People's Libyan Arab Jamahiriya, transforming Libya into a revolutionary new state. In a bold move, Gaddafi envisions a system of direct popular rule, where power rests with the people themselves. As the nation embarks on this radical transformation, the world watches closely—questioning whether Gaddafi’s vision of "people’s power" will truly reshape Libya, or if his tight grip on the reins will lead to further consolidation of control."
 news.1608.a: "Their flag is only one color!"
 news.1609.t: "[GetNewspaperHeader]Muammar Gaddafi launches Chadian intervention"
 news.1609.d: "In a dramatic escalation of tensions, Libyan forces launched a full-scale invasion of northern Chad. The attack, ordered by Brotherly Leader Muammar Gaddafi, aims to assert control over the resource-rich region of the Aouzou Strip, an area long claimed by both nations. As Libyan troops advance, the Chadian government, under heavy pressure, is scrambling to defend its territory. The invasion threatens to destabilize the entire region, with international observers concerned about the potential for broader conflict and the involvement of foreign powers."
 news.1609.a: "Will this really be worth it?"
 news.1610.t: "[GetNewspaperHeader]François Tombalbaye deposed in army coup"
 news.1610.d: "In a dramatic turn of events, President François Tombalbaye of Chad has been overthrown in a military coup, orchestrated by General Félix Malloum. Tombalbaye, who had ruled the country since independence, was ousted by Malloum and a group of army officers following growing unrest over his increasingly autocratic leadership. The coup has left the country in turmoil, with Malloum now assuming control of the government. As tensions rise, many are left questioning the future direction of Chad under this new military regime."
 news.1610.a: "The new states of the Sahel are an enigma"
 news.1611.t: "[GetNewspaperHeader]Ibrahim Abboud Stages Coup"
 news.1611.d: "In a stunning turn of events, Sudan’s Sovereignty Council, led by President Ismail al-Azhari, has been overthrown in a military coup led by General Ibrahim Abboud. Al-Azhari, who had been in power since Sudan’s independence, was ousted by Abboud and a group of army officers disillusioned with the government's inability to manage political instability and economic struggles. The coup has left the nation in turmoil, with Abboud now assuming control of the government. As Sudan faces an uncertain future under military rule, many are left questioning the country’s path forward."
 news.1611.a: "Democracy, dead in the cradle"
 news.1612.t: "[GetNewspaperHeader]Gaafar Nimeiry Stages Nasserist Coup"
 news.1612.d: "In a dramatic shift of power, Sudan’s government has been overthrown in a military coup led by Colonel Gaafar Nimeiry. The coup, which ousted the civilian government, came after growing unrest and dissatisfaction with the country’s political instability and economic challenges. Nimeiry, a young military officer, swiftly took control, promising to restore order and implement reforms. Drawing heavy inspiration from Egyptian leader Gamal Abdel Nasser and Pan-Arabism, Nimeiry’s new regime is expected to push for closer ties with the Arab world, potentially steering Sudan toward a more socialist and nationalist path."
 news.1612.a: "Another Free Officer's Coup?"
 news.1613.t: "[GetNewspaperHeader]Abdel Rahman Swar al-Dahab Overthrows Sudanese Government"
 news.1613.d: "In a swift and unexpected move, Sudan’s government has been overthrown in a military coup led by General Abdel Rahman Swar al-Dahab. The coup ousted President Gaafar Nimeiry’s regime, which had been struggling with political instability and economic challenges. Swar al-Dahab, who led the military forces, promised to return the country to civilian rule after a transitional period, signaling a break from the authoritarian governance of the past. As Sudan navigates this new phase, many are left wondering how the military’s influence will shape the nation’s future, especially in terms of its relationships with both regional powers and the push for democratic reforms."
 news.1613.a: "Will democracy really return?"
 news.1614.t: "[GetNewspaperHeader]Civilian Democracy Returns to Sudan"
 news.1614.d: "In a significant political shift, Ahmad Al-Mirghani has been inaugurated as the President of Sudan, following a peaceful transition of power. Al-Mirghani, leader of the Democratic Unionist Party, takes office after a period of political turmoil and military rule, signaling a return to civilian governance. His inauguration marks a new chapter for Sudan, with Al-Mirghani pledging to promote national unity and address the country’s pressing economic and social challenges."
 news.1614.a: "A miracle"
 news.1615.t: "[GetNewspaperHeader]Omar al-Bashir Establishes Military Junta"
 news.1615.d: "In a shocking and swift move, Sudan’s government has been overthrown in a military coup led by General Omar al-Bashir. The coup ousted the government of Prime Minister Sadiq al-Mahdi, marking the end of the country’s short-lived democratic experiment. Al-Bashir, who led the military forces, quickly assumed control, promising to restore stability and address the nation’s economic and political turmoil. With his rise to power, Sudan is now under military rule once again."
 news.1615.a: "Shocking"
 news.1616.t: "[GetNewspaperHeader]Declaration of the Tunisian Republic"
 news.1616.d: "In a momentous decision, Tunisia has officially declared itself a republic, abolishing its monarchy and ushering in a new era of governance. The National Assembly voted to dissolve the monarchy, with Habib Bourguiba—who had previously served as prime minister—becoming the nation’s first president. This historic shift follows years of nationalist struggle and Tunisia’s hard-won independence. Bourguiba now stands at the helm, pledging to modernize the country and steer it toward progress, though the challenges of consolidating this bold new republic remain significant."
 news.1616.a: "A secular, republican, Tunisia?"
 news.1617.t: "[GetNewspaperHeader]The Medical Coup"
 news.1617.d: "In a dramatic and unexpected turn, Tunisia has witnessed what’s being called a "Medical Coup" against President Habib Bourguiba. After years of leading the nation as both president and prime minister, Bourguiba, whose health had been in decline, was formally removed from power. In a move orchestrated by his inner circle and military officials, the ailing president was declared unfit to rule, and his powers were transferred to Prime Minister Zine El Abidine Ben Ali. This sudden shift marks the end of Bourguiba’s long reign, which had shaped Tunisia’s post-independence identity, and raises questions about the country’s future direction under Ben Ali’s leadership."
 news.1617.a: "A new chapter for Tunisia"
 news.1618.t: "[GetNewspaperHeader]The Death of Muhammad V"
 news.1618.d: "In a moment of profound national sorrow, Morocco mourns the passing of King Muhammad V, who died today after a prolonged illness. The beloved monarch, who led Morocco to independence from French colonial rule in 1956, was a symbol of unity and resilience for the nation. His death marks the end of an era and the beginning of a new chapter in Morocco’s history. With the nation in mourning, Crown Prince Hassan, the eldest son of Muhammad V, is set to ascend the throne as King Hassan II. The transition of power is expected to be smooth, as Hassan II, a well-regarded figure, prepares to continue his father's legacy while navigating the challenges of a rapidly changing world."
 news.1618.a: "The last bastion of monarchism in the Maghreb"
 news.1619.t: "[GetNewspaperHeader]The Death of Hassan II"
 news.1619.d: "Morocco is in mourning today following the death of King Hassan II, who passed away after a long period of illness. The late king, who ruled for nearly four decades, was a pivotal figure in modernizing Morocco and guiding it through times of political turbulence and economic change. His leadership was marked by significant reforms, as well as a strong stance in foreign policy, particularly in relation to the Western Sahara conflict. As the country grapples with the loss of its longtime leader, the throne will now pass to his son, Crown Prince Mohammed VI. With the transition of power, many anticipate a new era of reform under the young king, who has long been seen as a symbol of renewal."
 news.1619.a: "The Moroccan Monarchy is unbreakable"
 news.1620.t: "[GetNewspaperHeader]Houari Boumediene Orchestrates Coup D'État in Algeria"
 news.1620.d: " In a dramatic seizure of power, Colonel Houari Boumediene, former Chief of Staff and close ally of ousted President Ahmed Ben Bella, has overthrown the government in a bloodless military coup. The coup, executed in the early hours, saw Boumediene’s forces swiftly take control of key institutions, including radio stations, military barracks, and government buildings. Ben Bella, who led Algeria to independence in 1962, was reportedly arrested and is now in military custody. Boumediene, addressing the nation via radio, declared the dissolution of the National Assembly and the establishment of a 26-member Revolutionary Council to govern the country, citing "deviation from revolutionary ideals" and "political instability" as justification for the takeover. The international community watches closely as Algeria, a pivotal player in the Non-Aligned Movement, enters a new era under military rule."
 news.1620.a: "No ideological inconsistences?"
