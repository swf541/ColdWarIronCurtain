#fucking hell
 conquest.100.d: "The Republic of Korea is now at the brink of collapse as its capital, Seoul, has just been successfully invaded by advancing North Korean troops. North Korea, utilizing tactics similar to Blitzkrieg, have used their Soviet made tanks to forcefully advance themselves towards Seoul, with heavy casualties left for the South Koreans since they lack any sort of anti-tank weaponry or tanks at all. The South Koreans, in an effort to halt the North's advance, have blown up the bridge within Han River, trapping thousands of soldiers and civilians who desperately need evacuation and medical attention. This event in the Korean War shows the weakness of the American-backed South Korea, and observers speculate that if this trend continues, capitulation is expected to happen within months."
 
 conquest.101.d: " Hope for Democracy and Civil Liberties in the Korean Peninsula have once more been ignited, as the UN Coalition composed of the United States and her allies have managed to retake Seoul from the KPA stationed to garrison and occupy the city. The victory however wasn't easy, as the KPA have set up defensive fortifications at nearly every corner of the city, with barricades and anti-tank weaponry riddled all over Seoul. Nevertheless, the coalition force was able to pierce through every resistance the KPA placed on them, and have finally retaken Seoul for South Korea. This victory will send a clear message to Pyongyang that the fight for the Korean Peninsula will soon come to their shores, and their land tainted with blood and despair."
 
 conquest.102.d: "The tides have shifted in the Korean Peninsula, for the intervention of the People's Republic of China has brought about the fall of Seoul once more, reclaiming it from the UN coalition forces. The coalition, surprised and exhausted from the battle, have undergone a mandatory evacuation from the Seoul Metropolitan Area towards other cities in the South, but are demoralized and are incapable of fighting at this time. This defeat will play a critical role in deciding the fate of the Korean Peninsula, and so far observers believe that the coalition of China and North Korea will most likely win. However, those same observers have doubts on their predictions, since numerous reports indicate that the Chinese forces are exhausted and overwhelmed by the war, and it will take time and effort to regain their strength, which may open an opportunity for a counterattack by UN coalition forces."
 
 conquest.103.d: "In the light of defeat after defeat, the UN coalition forces have devised an operation that will break both the Chinese and North Korean forces. The operation is called \"Operation Ripper\", an artillery bombardment throughout the Seoul Metropolitan Area followed by a siege of the area. The artillery bombardment is designed to inflict maximum damage towards the Sino-North Korean coalition, while minimizing casualties on the UN coalition. According to our sources on the ground, it is a great success, with casualties in the tens of thousands for Chinese and the North Koreans, with half of the Seoul Metropolitan Area under UN control. Observers believe that since the war has ravaged so long, the UN will press for an armistice agreement to end the conflicts in the peninsula once and for all."
 
 conquest.104.d: "The capitulation of the Republic of Korea is coming sooner than expected, as North Korea was able to break the Pusan perimeter, the only line of defense for South Korea and its only major city left, as the rest have been occupied by North Korea. As of writing, the remainder of the UN coalition forces are evacuating to the island of Jeju, the only island that hasn't been touched by North Korean forces. However, seeing this, North Korea have initiated efforts in placing long range artillery that is able to target Jeju island, so observers are expecting mass casualties for the inhabitants of the island. With Pusan gone, it is expected that North Korea will claim the entirety of the peninsula and South Korea will merely be reduced to a government-in-exile similar to the governments of nations occupied by the Nazis in WW2."
 
 conquest.105.d: "The days of the Democratic People's Republic of Korea are numbered, as the UN coalition forces have successfully invaded and occupied Pyongyang, the capital of North Korea. In the midst of the chaos and confusion, some of North Korea's elites and prominent government officials were able to evacuate the capital, while some were unlucky and their fate in the hands of the UN coalition forces, with Kim Il-Sung included in those who evacuated. This is a clear victory for the UN coalition, as they have finally pushed back the North Koreans towards the mountain ranges, ensuring capitulation within months. However, observers point out that should an outside force intervene in the crisis, such as the Soviet Union or the People's Republic of China, the said victory is temporary and will be catastrophic in the near future."
 


 coronation.1000.d: "His Majesty, George VI, King of the United Kingdom and the British Dominions and the Final Emperor of India has been found dead in his bed at Sandringham House in Norfolk this morning after almost two years of declining health. Though he was second in line after his elder brother Edward VIII, he found himself King of the British Empire at the brink of what would soon become the Second World War. Throughout the war, King George's presence boosted the morale of the subjects of the crown, both at home and on the front. His daughter Elizabeth has ascended as Queen Elizabeth II, and is making a hasty return for the funeral from abroad."
#stop putting shit in air disasters
 NNE.1.d: "In a landmark case, Loving v Virginia has passed striking down all laws against interracial marriage. The case was brought to trial by Mildred Loving and Richard Loving, an interracial couple who were sentenced to prison in Virginia for marrying each-other. The trial went on for several days but it was eventually unanimously decided that the prohibition was unconstitutional. In addition to the passing of the law, Pace v Alabama was overturned. Pace v Alabama ruled that anti-interracial marriage laws were constitutional.\nThere are mixed reactions throughout the country but the majority sentiment is very positive in favor of the ruling. Civil rights groups are currently celebrating this day and declaring that \"Loving Day\" is officially a landmark civil rights holiday."
 NNE.2.d: "In a landmark case, Roe v Wade has officially declared that restricted access to abortion is unconstitutional, making the US one of the less than five countries in the world with on-demand abortion. The court ruled seven to two that the Due Process Clause protects a women's right to abortion. State and federal restrictions on abortion have been overturned. Roe v Wade has sparked national debates on whether abortion should be legal and to what extent.\nThe country seems heavily divided on the issue and grassroots movements have been activated on both sides. The pro-abortion camp, which calls itself 'pro-choice' defends the decision by claiming that it is a woman's choice and a crucial woman's right. The anti-abortion camp, which calls itself 'pro-life' opposes the decision saying it is taking the life of a child and that it is immoral.\nRegardless of anyone's views, this decision will shape US politics for years to come."
 NNE.3.d: "The DDR has announced that it will be constructing the Palace of the Republic. The Palace will be built in East Berlin to seat the parliament of the German Democratic Republic. The Palace is planned to be constructed on the site of the former Berliner Stadtschloss in the square. The Palace of the Republic will serve as both a cultural and political testament to the German Democratic Republic.\nThe Berliner Stadtschloss was destroyed during WWII and was never repaired or replaced. Shortages in finance and a bureaucratic deadlock resulting from massive political changes prevented it from being rebuilt."
 NNE.4.d: "In a landmark case, Carey v Population Services International has officially ruled that it is unconstitutional to prohibit anyone other than a licensed pharmacist to distribute nonprescription contraceptives to persons 16 years of age or over. Additionally, Carey v Population Services International also ruled that individuals under the age of 16 cannot be denied contraceptives by anyone. The Court held that the Due Process Clause of the 14th Amendment does not allow a state to intrude on an individual's decisions on matters of procreation. The primary appellee, PSI, is a nonprofit corporation to provide knowledge about birth control and provide birth control services. The secondary appellees are Reverend James Haden who led a program to give out nonprescription contraceptives, Physicians who specialize in birth control, and a resident of New York who wants to distribute contraceptives to his children."
 NNE.5.d: "In a landmark case, Planned Parenthood v Casey has officially ruled that states can pass laws regulating abortion past the third trimester. In Casey, plaintiffs challenged 5 of the provisions of the Pennsylvania Abortion Control Act of 1982:\nInformed Consent; the doctor must provide specific information 24 hours before the procedure including health and viability\nSpousal Notice; a woman seeking abortion must notify the father\nParental Consent; minors have to have consent from the parents\nMedical Emergency; in which termination of pregnancy is immediately necessary to avert the death of the mother\nReporting Requirements; Certain reporting and record keeping mandates on facilities providing abortions"
 NNE.6.d: "In a landmark case, Abington School District v Schempp has officially ruled that school-sponsored bible reading in public schools is unconstitutional. The school district argued that the bible is a part of their curriculum and Schempp argued that it violated secularity and the freedom of religion. After a long hearing and gradual escalation, the case reached the Supreme Court. Pennsylvania's statute compelling school districts to perform Bible readings was overturned in the process. The issue has many different individuals divided and bringing arguments in favor and in opposition to the ruling."
 NNE.7.d: "The DDR's main airline, Deutsch Lufthansa, has officially been terminated for failing to meet profit quotas. Commentators however say that this was due to an imminent suit against the DDR airline for use of the Lufthansa name. All Deutsch Lufthansa assets have been given to another DDR airline, Interflug."
 NNE.8.d: "The Berlin Palace's demolition has been announced today by the German Democratic Republic. The Palace has been declared a symbol of Prussian militarism and will be destroyed as a result. The demolition will proceed quickly and will begin within' a few weeks. Walter Ulbricht, General Secretary of the Central Committee, is declaring that the Palace's cultural symbolism and testament are an affront to the workers of the People's Republic and to Socialism as a whole.\nThere are objections coming from people within' the GDR and outside of it who believe the Palace to be a cultural and historical monument that means far more, if at all, than militarism.\nThe process is estimated to take 3-5 months and 19 tons of dynamite."
 NNE.9.d: "\nLhamo Dhondrub, now known as Tenzin Gyatso, has been proclaimed as the 14th Dalai Lama. Officially declared the Dalai Lama in 1940, Tenzin Gyatso has officially assumed his full duties at the age of 15.\nIn the late 1930s, Reting Rinpoche had a vision that led him to the home of the Dalai Lama's incarnation, Lhamo Dhondup. Sera Lama reported that Lhamo Dhondup held an old rosary that belonged to the 13th Dalai Lama and the boy recognized Sera Lama immediately. Lhamo Dhondup also referred to Sera Lama in the dialect of the 13th Dalai Lama which his biological mother could not recognize. He was presented with a series of possessions, some of which belonged to the Dalai Lama and others that did not.\nThe assumption of duty will have major implications for Buddhists around the world and the political region in general. The decisions and teachings of the 14th Dalai Lama will pave the political landscape for years to come."
 NNE.10.d: "Alger Hiss, an American government official, has been accused of being a Soviet spy and is being convicted. The evidence against Alger Hiss includes a claim by Whittaker Chambers, a former US Communist Party Member, that Alger Hiss was a communist. Hiss filed a defamation suit against Chambers. However, Chambers also produced new evidence that both he and Hiss were involved in espionage. The court will proceed in light of this evidence and include perjury as some of the evidence conflicts with claims that Alger Hiss had made previously. The trial has brought up new discussions regarding the extent of Soviet espionage in the United States."
 NNE.11.d: "A tragic plane crash in Sverdlosk has cost the lives of 19 people and the entire VVS Moscow ice hockey team. The plane, en route to a match, crashed as a result of poor weather. A heavy snowstorm coupled with strong winds blew the plane into a tailspin, crashing it into the ground. Only 2 of the team survived. Bobrov overslept and Shuvalov was injured.\nIn memory of the dead, a memorial is being erected near the common grave in Koltsovo. Many of the team's fans are now in morning over the loss.\nVasiliy Stalin, Joseph Stalin's son and patron of the team, is now attempting to recruit a new team and expects to have everyone recruited within' a day in time for the big game." 
 NNE.12.d: "\nSenator Kefauver has begun hearings on organized crime, a major problem according to United States articles of 1949. Kefauver has already said he plans to interview over five hundred people on the topic of organized crime. Kefauver has publicly stated that he believes that a large Sicilian organization based on family ties operates a large mafia throughout the United States. The Committee plans to nationally broadcast these hearings to the entire country. Regardless of whether Kefauver's prediction is correct, this will go a long way to help understand and destroy the problem of organized crime in the United States."
 NNE.13.d: "A massive, magnitude 8.6 earthquake has struck the region of Assam-Tibet. More than 1,526 people were killed and 30000 were injured and massive amounts of property damage were reported. The earthquake has been traced back to 2 continental plates converging. Geological field studies from around the globe are being sent to the site of the earthquake to study it and humanitarian aid is arriving around the world to help. However, in a shocking development, there are hundreds of 'disaster tourists' who are arriving to see the destruction but do not intend to aid. Unlike the scientists who are avoiding travelling in paths that obstruct humanitarian efforts, the disaster tourist vehicles are blocking infrastructure and caused minor setbacks. Despite this, relief efforts will progress nominally."
 NNE.14.d: "Pope Pius XII has promulgated Humani Generis, the latest Papal Encyclical. The Encyclical seeks to address many opinions that the Pope believes are threatening to undermine the foundations of Catholic Doctrine. It addresses the role of theology, obstacles to finding God, issues the Pope has with modern culture, several theological developments involving the Catholic Church after WWII, and polygenism. Additionally, the Encyclical takes a nuanced position with evolution and states that human sciences are not in conflict with biblical teachings. The position on evolution has many theologians reconsidering their positions and many religious individuals leaving the Young Earth theory behind."
 NNE.15.d: "The US federal government is conducting a long series of prosecutions against the Communist Party of the United States. The group has been charged with the violation of the Smith Act, a statute that imposes penalties on people for advocating the violent overthrow of the government. The defendants are countering by stating that they want a peaceful transition and that no matter what, the Freedom of Speech protects their views and statements. CPUSA's statements have sparked a national debate over the Freedom of Speech which has drawn people around the country to argue in favor of CPUSA's right regardless of their own personal affiliations or feelings about communism."
 NNE.16.d: "After 4 months and 19 tons of dynamite, the Berlin Palace has been officially demolished despite objections. The foundation was so solid that the entire mount of the building remained intact even when it fell onto the ground. The only section that has not been demolished is a portal from the balcony where Karl Liebknecht had declared the GDR. Construction for a new building, the Council of the State, is being planned on the former building's site. Planning and funding have already been finished and secured respectively. The portal from the balcony will be included in the new building as it is considered important to the GDR and its culture.\nA majority of the artifacts inside will be preserved in storage, to a minor relief to people who believe the building to be culturally important."
 NNE.17.d: "\nJulius and Ethel Rodenberg are on trial for espionage today. The two individuals and their co-conspirators have been convicted and have a large base of evidence against them. Evidence has been found that they provided top-secret information about radar, sonar, and jet propulsion engines to the USSR. Additionally, evidence was found that they were transmitting top secret nuclear weapons data to the USSR, which is known to now be in the hands of the Soviet Union.\nThe implications of transmitting nuclear weapons data to the Soviets are severe. Up until now, the only country that has nuclear weapons is the US. However, with the loss of this data, the Soviet Union will be able to begin construction of its own nuclear weapons and pose a threat to the western powers.\nThe shakedown for other spies who were involved is underway and the country's nuclear research facilities are under lockdown until the shakedown is complete."
 NNE.18.d: "In a landmark case, Dennis v United States has ruled that Dennis, the General Secretary of CPUSA, does not have protection under the 1st amendment if the exercise involves the creation of a plot to overthrow the government. The trial found Dennis guilty of conspiring to overthrow the government and must be punished under the Smith Act. Dennis previously claimed that there was no plot and that he advocated a peaceful transition to socialism. Ten other CPUSA members were also found convicted of advocating the violent overthrow of the government. The trial reached the supreme court and it was ruled six to two in favor of punishing Dennis and the other conspirators. The conspiring CPUSA members have been sentenced to 5 years in prison with a $10000 fine each."
 NNE.19.d: "The floods which have hit the North Sea's coastline this winter has had devastating results for the people of The Netherlands, Britain, and Belgium. Water Dykes proved unable to hold back the swelling tides, flooding the coasts with unprecedented fury. The Netherlands has been hit the worst, suffering near catastrophic damage as over 9% of arable land has been ruined with an estimated 1,800 lives being lost. The province of Zeeland remains in a state of disarray as severe flood damage makes transportation and rescue efforts arduous until water levels drop. Damage in Southern England and Scotland has been substantial as well, with an estimated 300 people dying due to the floods. Belgium has also taken damage to its coast, though on a much smaller scale then in comparison to its neighbors."
 NNE.20.d: "The New York Giants have won the National League!\nBobby Thomson, the outfielder and third baseman for the Giants struck a game-running home run for the team off of Brooklyn Dodgers pitcher Ralph Branca. In the final inning, Thomson struct a three-run homer winning the game against the Dodgers.\nThis is a historical moment for the country as the game is the first ever televised nationally and is seen by millions of viewers with millions more hearing it on radio. The game winning strike is officially being declared the \"shot heard 'round the world\", after the gunshot that started the Revolutionary War in 1776, because it is being broadcasted to so many Americans including overseas servicemembers."
 NNE.22.d: "A series of magazine articles titled "Man Will Conquer Space Soon" has been published in Collier's Magazine. The articles detail Wernher von Braun's plans for manned spaceflight. The articles have sparked a massive national interest in space travel and futuristic optimism. The articles feature detailed drawings, paintings, and illustrations created by the magazine's design team and stun readers with their vivid imaginings of life in space. Already the country is discussing the implications of space travel and colonization and what the world can do if it pursues these technologies."
 NNE.23.d: "A massive strike has been organized by the United Steelworkers of America against 10 major steelmakers in the US but was stopped as President Harry S Truman nationalized the American steel industry before the walkout and gave the workers a wage increase. The steel companies who lost control of their facilities are now suing the government to regain their properties. If the President wins the case, albeit unlikely, then it could have serious implications regarding the authority of the government's ability to nationalize industry.\nSenator Joseph McCarthy is officially denouncing the president for permitting known communists to remain in employment."
 NNE.24.d: "In a landmark decision, Youngstown Sheet & Tube Co v Sawyer has ruled that the president does not have the authority to nationalize industries and the steel facilities must be returned to their private owners. The supreme court declared that without authority conferred on him by Congress, the president is not allowed to seize government control over private property. The court voted six to three in favor of Youngstown Sheet & tube Co. The facilities are being immediately handed over to their former private owners but no damages are being paid from the loss of profit in the time that the facilities were under government control."
 NNE.26.d: " In the southern San Joaquin Valley, a 7.3 magnitude earthquake has caused 2.6 million dollars of damage and at least 11 killed in the town of Tehachapi. Two railroad tunnels collapsed and the town of Bakersfield was also affected. Pipelines were damaged by aftershocks to the event as well. Cotton growing near the earthquake was also offset. Beno Gutenberg, the director of the Caltech Seismological Lab, was surprised by the shock. He said: 'There is no doubt that yesterday's quake is the largest Southern California has had in this century.' The American Red Cross has declared the earthquake a major disaster with around 700 families affected, however access to the area has been impeded by landslides."
 NNE.27.d: "The Republic of China in Taiwan and Japan have finally declared peace. The delay in peace negotiations was due to neither Chinese governments attending the Treaty of San Francisco because of the Chinese Civil War. The United States is said to have exerted major pressure over Japan in order to make them sign a peace conference. The text of the Treaty is similar to the Treaty of Francisco's but it has been edited to fit the Republic of China. The Treaty does not mention who the true owner of Taiwan should be, and instead primarily deals with Japanese claims and nationals."
 NNE.28.d: "Thirteen Jews have been executed in Lubyanka Prison, Moscow. After being arrested since June 1949, the entire defendants were accused of undermining the Soviet Union. Their trial is an indicator of Stalin now turning against the Jewish Anti-Fascist Committee which had helped Jewish culture rebuild after the Holocaust. Five Yiddish writers were also killed as part of the thirteen. One victim, Solomon Bregman, fell unconscious when the death sentence was passed and has not waken yet. Lina Stern, also convicted, was not executed due to her scientific work. Most unusually, there were no prosecutors or defense attorneys, simply three military judges who asked random questions."
 NNE.29.d: "Jonas Solk, an American medical researcher, has announced on CBS he has created a vaccine against the debilitating disease poliomyelitis. Solk took the approach of Maurice Brodie, which was to kill strains of polio and inject them into a person. Solk says he is writing an article for the American Medical Association that will be published soon. This is a major breakthrough in polio treatment, as it is now less susceptible to younger people who are particularly affected by it."
 NNE.30.d: "Dag Hammarskjold has been appointed the second United Nations Secretary-General as a mostly unbiased candidate. He has never been aligned with a political party despite his service in the Swedish Government, especially its diplomatic corps. He was unanimously appointed Secretary-General, and he will continue to reign for five years until 1958. "
 news.1000.t: "[GetNewspaperHeader]End of the Nuremberg Trials"
 news.1000.d: "The Nuremberg trial on World War II finally came to an end after 4 years. 24 of the most important leaders in the former Nazi Germany went to trial from 1945-1949 for their crimes ranging from simple invasions to mass genocide. Among other things, the 15 closest allies to Hitler (who were still alive) were sentenced to either death or life imprisonment. The top 10 prominent members of the political and military leadership of Nazi Germany were executed by hanging. However, several other Nazi officials would commit suicide while waiting for trial. The only exception is Speer, who was to only one to show any remorse. 7 Nazi officials would be imprisoned in Spandau Prison, nicknamed the Spandau Seven, including Albert Speer, Rudolf Hess, Karl Dönitz, and others being sentenced to prison for varying amounts. The world can now heal knowing that the men who caused World War II and the suffering behind it are either dead, imprisoned, or waiting for trial."
 news.1000.a: "It's over now."
 news.1002.t: "[GetNewspaperHeader]End of the Berlin Airlift"
 news.1002.d: "The USSR suddenly blocked all ground traffic to West Berlin in June 1948 to force the other occupation states to fulfill its demands. As a result, West Berlin couldn't be supplied with clothing, medical supplies or even food. So the NATO states had the brilliant idea to not to push for an aggressive response, but to setup an airlift. Only after 15 months and the landing of 277,264 planes, the blockade finally ended without any shot being fired."
 news.1002.a: "Let's hope the peace lasts!"
 news.1002.b: "We could have done better..."
 news.1003.t: "[GetNewspaperHeader]A Korean War Breaks Out"
 news.1003.desc: "Korea was ruled by Japan from 1910 to World War 2. When the Soviet Union declared war on Japan in 1945, soviet troops moved into the northern part of Korea and United States' forces liberated the south. Both war participants made an agreement and split Korea in North and South Korea. They eventually formed their part to be like their country and so the north became communist and the south became capitalistic. But as they both claimed to be the legitimate government of all Korea, the conflict escalated today as North Korean troops moved into South Korea."
 news.1003.a: "Do we take action?"
 news.1003.b: "Communism shall win!"
 news.1003.c: "This will not end well."
 news.1003.d: "They don't stand a chance!"
 news.1003.e: "We need some help!"
 pinyin_tt: "All City and State Names will update to use Pinyin"
 news.1004.t: "[GetNewspaperHeader]The PRC creates Simplified Chinese"
 news.1004.d: "The Chinese government officially released details on a new document called the "Chinese Character Implication Scheme" and a new order requiring schools to implement the new Chinese characters in schools. Although the Language Reform Research Committee of China began the process of simplifying Chinese characters since 1952, the movement to simplify the language can be traced to the early twentieth century. The Chinese government argues the simplification of Chinese will improve literacy and spread education across all people in China. The government believes the new changes will make publishing easier and also allow the spread of news or information to all levels of society. Some Chinese have expressed concerns over the reforms, claiming the government should not interfere with a written text that has existed for millennia. Regardless, Chinese schools across the nation will soon receive textbooks and instructions on teaching the new characters to all students."
 news.1004.a: "May this bring our country together."
 news.1004.b: "Great!"
 news.10004.d: "The Chinese government has published a document announcing the official romanization system for the Chinese language called pinyin. The pinyin system is the result of the top Chines linguists collaborating on the issue for the Ministry of Education. The government claim this will make it easier for the government to translate foreign documents and make the Chinese language more approachable abroad. More importantly, it will enable China to more effectively spread its ideas and opinions across the globe. Chinese governments have attempted to create a romanization of Chinese since the early twentieth century and the United States government made its own system called the Yale system. Pinyin is meant to replace the Yale system and the Chinese government was quick to declare pinyin the official romanization system of the Chinese language."
 news.1005.t: "[GetNewspaperHeader]Founding the new China"
 news.1005.d: "The People's Republic of China finally won its civil war against the Republic of China. The second phase of the Chinese Civil War has come to an end. The Republic of China and the People's Republic of China have been fighting for 3 years now. Even before that they were fighting since 1927 up till 1936 when China was invaded by the Japanese Empire. After World War II in 1946, the fighting resumed and was a stalemate up till 1948. In 1948 the Communist Chinese forces broke through Beijing and went into Central China, and causing hundreds of thousands of Democratic Chinese soldiers to be encircled. It wasn't till late 1949 that the Republic of China fled to Taiwan and other parts of Southeast Asia. Premier Mao has declared a new China and one that will be the only strong China. Hundreds of thousands gathered in Beijing as they watched Mao Zedong give his speech. The war in China has calmed down for now."
 news.1005.a: "May it last forever!"
 news.1005.b: "Interesting."
 news.1006.t: "[GetNewspaperHeader]The PRC establishes Foreign Ministries"
 news.1006.d: "The People's Republic of China has established Foreign Ministries in the USA and the Soviet Union after their 4 year long war and even before that with the Republic of China. The People's Republic of China is claiming their government to be the One True China, while the Republic of China as 'Occupied Taipei'. For now it seems the USSR has recognized the new Chinese government, while the US has still recognized the Republic of China as the One China. "
 news.1006.a: "Are we welcome?"
 news.1006.b: "Welcome to us!"
 news.1006.c: "Interesting."
 news.1007.t: "[GetNewspaperHeader]PRC announces Sino-Soviet Treaty"
 news.1007.d: "The People's Republic of China announced a treaty with the Soviet Union. This morning in Beijing, the People's Republic of China announced that it has signed a treaty of friendship with the Soviet Union. It is called 'Sino-Soviet Treaty of Friendship, Alliance and Mutual Assistance. The treaty includes the Soviet withdrawal of Manchuria and Dalian, transportation fixes, and a short term 'alliance' up till 1979. The USSR and PRC have signaled to the West that they will stand together to unite the people of the world under Communism!"
 news.1007.a: "We help each-other"
 news.1007.b: "This could get dangerous"
 news.1007.c: "Okay..."
 news.1008.t: "[GetNewspaperHeader]PRC accepts Marshall Plan"
 news.1008.d: "The People's Republic of China announced that they would accept the Marshall Plan proposed by the United States of America. The PRC will now receive tools and money to rebuild their country after the second World War and their civil war. This comes as an shock as many thought the PRC would accept the Molotov Plan from the USSR. This sent a strong message to the USSR that just because the PRC is communist, it doesn't mean they will become another puppet state to them. The US is interested in making deals with the PRC, and could shake up the whole of East Asia."
 news.1008.a: "We help each other"
 news.1008.b: "This could get dangerous"
 news.1008.c: "Okay..."
 news.1009.t: "[GetNewspaperHeader]The Republic of China in Taiwan"
 news.1009.d: "The second phase of the Chinese Civil War has come to an end. The Republic of China and the People's Republic of China have been fighting for 3 years now. Even before that they were fighting since 1927 up till 1936 when China was invaded by the Japanese Empire. After World War II, the fighting resumed and was a stalemate up till 1948. In 1948 the Communist Chinese forces broke through Beijing and went into Central China, and causing hundreds of thousands of Democratic Chinese soldiers to be encircled. This year however, there was peace talks with the Marshall Mission about possible armistice with a division of China, or a peace plan. That plan failed and the fighting continued with the Yangtze Offensive into Southern China. After several routs by the Republic of China, the Republican Government has fled to the island of Taiwan. Chiang Kai-Shek has stated that the Republic of China lives on, and that one day the Republic of China flag will be waived over Mainland China again. Reports of hundreds of thousands of soldiers and refugees are fleeing to Tibet, Burma, Thailand, and Taiwan."
 news.1009.a: "They are still alive?"
 news.1009.b: "The Dominos have fallen."
 news.1009.c: "We'll be back."
 news.1010.t: "PRC declares One China Policy"
 news.1010.d: "The People's Republic of China just declared its One China Policy. Under this policy, both governments (PRC and ROC) agree that there can only be one sovereign state governing over mainland China. But their disagree about which state is the legitimate government of this state. Every other state who seeks diplomatic relations with the Peoples Republic has to break relations with the Republic and vise versa."
 news.1010.a: "We are the legitimate government!"
 news.1010.b: "Who shall we go with?"
 news.1011.t: "[GetNewspaperHeader]PRC approaches the USSR"
 news.1011.d: "During their Moscow Mission, the People's Republic of China approached the USSR and held discussions about the future of their counties."
 news.1011.a: "The future looks great."
 news.1011.b: "Interesting."
 news.1012.t: "[GetNewspaperHeader][From.GetName] joins the Warsaw Pact"
 news.1012.d: "[From.GetName] officially joined the Warsaw Pact. They now stand together and expanded the Iron Curtain further."
 news.1012.a: "Great!"
 news.1012.b: "Interesting."
 news.1012.c: "Not. Good."
 news.1013.t: "[GetNewspaperHeader]PRC creates own faction"
 news.1013.d: "The People's Republic of China founded it's own faction. It is called 'People's United Asian Empire'. Do they plan on expanding this Empire?"
 news.1013.a: "Our Empire shall grow!"
 news.1013.b: "Interesting."
 news.1016.t: "[GetNewspaperHeader]PRC accepted in the UN"
 news.1016.d: "The People's Republic of China was accepted in the United Nations as the 4 major members, France, Britain, the United States and the Soviet Union voted for yes. The only party saying no to it was the Republic of China. They lost the civil war, but they apparently don't want to recognize their defeat."
 news.1016.a: "Together we are stronger."
 news.1016.b: "A new member by our side!"
 news.1016.c: "They shall be welcome."
 news.1016.e: "Enemies forever!"
 news.1017.t: "[GetNewspaperHeader]PRC not accepted in the UN"
 news.1017.d: "The People's Republic of China was not accepted into the United Nations as one or more of the 4 major members, France, Britain, the United States and the Soviet Union voted for no, so did the Republic of China. They like the fact, that the PRC was not accepted."
 news.1017.a: "We tried our best."
 news.1017.b: "Stay out!"
 news.1017.c: "Interesting."
 news.1017.e: "Enemies forever!"
 news.1018.t: "[GetNewspaperHeader]The Unification of Trieste"
 news.1018.d: "Today, the London Memorandum was signed in London by the United Kingdom, United States, Italy and Yugoslavia about the unification of the Free Territory of Trieste. Both Italy and Yugoslavia agreed on the demands of the treaty. Italy will get Zone A which includes the city of Trieste, and Yugoslavia will get Zone B, which is the countryside of outer Trieste. This shall be a great day for a peaceful unification."
 news.1018.a: "We got our part."
 news.1018.b: "We could have both parts."
 news.1018.c: "Interesting."
 news.1019.t: "[GetNewspaperHeader]No Unification of Trieste"
 news.1019.d: "After talks in London, Yugoslavia has decided to back out of signing the London Memorandum due to the treaty being too much in Italy's favor. They accuse the United States and the United Kingdom of siding with Italy because of them following the capitalist ideals and wanting to stop a city falling to the Iron Curtain. Yugoslavia will not sign the treaty and tensions are at a all time high in the Mediterranean."
 news.1019.a: "Why?"
 news.1019.b: "We want both parts!"
 news.1019.c: "Worrying..."
 news.1020.t: "[GetNewspaperHeader]The Unification of Trieste"
 news.1020.d: "After new talks in London, Yugoslavia has decided to back down and signing the London Memorandum to not to risk a war. They still think, that the Treaty is too much in Italy's favor, but the treat of a world war forced them t back down. Tensions in the Mediterranean have been lowered."
 news.1020.a: "Lucky it didn't escalate."
 news.1020.b: "We had to do it."
 news.1020.c: "Lucky it didn't escalate."
 news.1021.t: "[GetNewspaperHeader]The War of Trieste"
 news.1021.d: "After days of tensions, talks have completely broke down between Yugoslavia and Italy. Both sides have threaten each other to back down and decide about Trieste, but both sides still claim they own Trieste. Just last night Yugoslavian troops crossed the border of Italy and Yugoslavian special ops have invaded Trieste and captured the city. Italy has said that they will defend their country once again and liberate the city of Trieste. A war has broken out in the Mediterranean and both East and West are to get involved in the war one way or another. These are dark times we are living in."
 news.1021.a: "We have to fight now!"
 news.1021.b: "It's worth it."
 news.1021.c: "Oh my God..."
 news.1022.t: "[GetNewspaperHeader]The Unification of Trieste"
 news.1022.d: "After talks in London, Italy has decided to back down on the signing of the London Memorandum due to Italy only getting Zone A of Trieste and not both zones. They said in a statement that they have historical documents showing that they have owned all of Trieste and not one-half of it. This has made tensions at an all time high in the Mediterranean and Yugoslavia and Italy are not moving on their ideals."
 news.1022.a: "We had to do it."
 news.1022.b: "That's great news!."
 news.1022.c: "Lucky it didn't escalate."
 news.1023.t: "[GetNewspaperHeader]The Franco-British Union"
 news.1023.d: "Once again the French and British fight in a new war side by side. A new Anglo-French Task Force has been created and shipped out to Egypt. The French Prime Minister wants to take one step further and proposed a Union between the 2 countries. The Minister said in a statement that the United Kingdom and the French need to band together to unite under 1 state to fight the enemies of the West. The Minister proposed that France would be annexed into the British Empire under the name of the Franco-British Union. The British then decided to form the Franco-British Union. The French government will take some time being integrated into the British Empire, but the new Union of the British and French has been formed."
 news.1023.a: "We are stronger together!"
 news.1023.b: "Interesting."
 news.1024.t: "[GetNewspaperHeader]Tito is Dead"
 news.1024.d: "Four kings, 31 presidents, six princes, 22 prime ministers and 47 ministers of foreign affairs have show up in Belgrade to mourn the loss of Marshal Tito, They come from both sides to pay respects to our great leader. Tito was pronounced dead in the department of cardiovascular surgery at the University Medical Center in Ljubljana from Gangrene, just three days from his 88th birthday."
 news.1024.a: "Rest in Peace Marshal."
 news.1024.b: "He was a great leader."
 news.1025.t: "[GetNewspaperHeader]End of the Greek Civil War"
 news.1025.d: "After three years and 6 months of fighting, almost 50,000 dead, and thousands missing, the Greek Civil War is over, with the Kingdom of Greece defeating the Provisional Democratic Government led by the Communist Party of Greece. Thanks to American Aid via the Marshall Plan and the Truman Doctrine, the royalist forces gained the upper hand against the communist forces, which were supported by the Soviet Union and various other socialist states in the Eastern Bloc. The Civil War has left Greece in ruins and the economy is hurting and now the reconstruction of a better and stronger Greece must follow. The royalist government has already stated that it seeks to continue cooperation with the west and experts already suggest that the victorious Greek state will soon apply for NATO membership."
 news.1025.a: "Our country at peace again."
 news.1025.b: "Interesting."
 news.1026.t: "[GetNewspaperHeader]End of the Malayan Emergency"
 news.1026.d: "The Malayan Emergency begun on June 16th, 1948. After months and months of a guerrilla war in the jungles of Malaya, the Emergency has finally come to an end. The countryside has been destroyed and many people are still homeless and wounded from the battles. Malaya is now starting the rebuilding process and is working on bringing the nation back together. The Commonwealth has called this a victory against stopping Communism from spreading to more and more of the world."
 news.1026.a: "Our country at peace again."
 news.1026.b: "Interesting."
 news.1026.desc: "The Malayan Emergency begun on June 16th, 1948. After months and months of a guerrilla war in the jungles of Malaya, the Emergency has finally come to an end. The countryside has been destroyed and many people are still homeless and wounded from the battles. Mayala is hoping to become a stronger country now that the people have finally rose up. The Commonwealth have called this a disappointing defeat in Mayala, and that they will do anything to hold back Communism from spreading elsewhere."
 news.1027.t: "[GetNewspaperHeader]End of the Second Malayan Emergency"
 news.1027.d: "A Second Mayalan Emergency has come to an end after the Communist rebels gained more support and help from other Communist nations in the region. More fighting was in the countryside again and a guerrilla war begun. After a long period of fighting, the rebellion has been put down. The Malaya and Commonwealth Governments have once again declared this a victory against Communism and that it will no longer spread."
 news.1027.a: "Our country at peace once again."
 news.1027.b: "Interesting."
 news.1027.desc: "A Second Mayalan Emergency has come to an end after the Communist rebels gained more support and help from other Communist nations in the region. More fighting was in the countryside again and a guerrilla war begun. After a long period of fighting, the people's rebellion was a success. The Democratic Malaya Government is now in exile and the Communists have taken over the country fully. The Malaya Government said that they will once return to take back their rightful land. The Commonwealth Government said in response that the Hearts and Minds Campaign just wasn't that successful as last time. Will there be another war in the region?"
 news.1028.t: "[GetNewspaperHeader]The Soviet Union conducts its first nuclear test"
 news.1028.d: "At 7:0am on the 29th August the Soviet Union conducted its first nuclear weapon at the Semipalatinsk test site, in the Kazakhstan SSR"
 news.1028.a: "They are a threat to world peace."
 news.1029.t: "[GetNewspaperHeader]Death of Joseph Stalin"
 news.1029.d: "Breaking news have erupted from the Soviet Union. In the words of the radio broadcast: 'The Central Committee of the Communist party, the Council of Ministers and the Praesidium of the Supreme Soviet of the U.S.S.R. announce with deep grief to the party and all workers that on March 5 at 9.50 p.m., Josef Vissarionovich Stalin, Secretary of the Central Committee of the Communist party and Chairman of the Council of Ministers, died after a serious illness. The heart of the collaborator and follower of the genius of Lenin's work, the wise leader and teacher of the Communist party and of the Soviet people, stopped beating. In these sorrowful days, all peoples of our country are rallying ever closer in the great fraternal family under the tested leadership of the Communist Party.'\nAfter an autopsy was performed, his body was embalmed for public viewing, with his funeral planned four days from his death."
 news.1029.a: "This Will Shock The Worlds Political Landscapes"
 news.1030.t: "[GetNewspaperHeader]Khrushchev becomes Soviet Premier"
 news.1030.d: "Nikita Khrushchev has just now become the leader of the Soviet Union. Time will tell how he approaches issues facing the Union."
 news.1030.a: "Let us hope for lasting peace"
 news.1031.t: "[GetNewspaperHeader]Soviet Union tests largest bomb yet"
 news.1031.c: "Deliver a statement to the Supreme Soviet and personally congratulate all those involved"
 news.1031.d: "The Soviets claim they have successfully tested the largest nuclear bomb to date. They call it Tsar Bomba, the King of Bombs."
 news.1031.a: "Issue a formal complaint to the Soviets"
 news.1031.b: "The Soviet's display of raw power will not go unnoticed on the world stage"
 news.1511.t: "[GetNewspaperHeader]Khrushchev speech at the United Nations"
 news.1511.a: "The relations between the Superpowers can't be worse"
 news.1511.d: "Three days after meeting Fidel Castro for the first time, [SOV.GetLeader] visited the United Nations on September 23, 1960. [SOV.GetLeader] believed communism was the future and that America needed to be contained. In his address to the U.N. General Assembly, [SOV.GetLeader] threatened to "bury" America"
 news.1512.t: "[GetNewspaperHeader]The House of Soviets"
 news.1512.a: "It look like a buried robot."
 news.1512.d: "During the reconstruction of the city of Königsberg -now Kaliningrad- the old Castle of Königsberg, already partially destroyed by bombings of the Great Patriotic War, has been demolished to destroy all traces of Prussian militarism. The Regional Secretary of the CPSU has decided to replace it with a building named House of Soviets, which will serve as the center of administration of the Kaliningrad Oblast. Its construction will start soon and it will hopefully be finished in around ten years"
 
 ###################################################################################################################

 news.1501.t: "[GetNewspaperHeader]Soviet Troops Cross Into Finland!"
 news.1501.d: "The Soviet Union has sent their troops over the Finnish border and have started to occupy towns. The Soviet Union has stated that they are doing this for the Finnish people for their own safety to protect them from the dangers of the West. The Finnish Government has not responded and people are wondering if they will attack the Soviet convoys. This is a very dangerous move by the Soviets. Could a 2nd Winter War break out?"
 news.1501.a: "Will a 2nd Winter War break out?"
 news.1501.b: "We need to make a decision about this!"
 news.1501.c: "We will liberate Finland from the West, one way or another."
 news.1501.e: "We will always support Finnish Independence!"
 
 news.1502.t: "[GetNewspaperHeader]Soviet Troops allowed in Finland"
 news.1502.d: "The Finnish Government has granted military access for the Soviet Union. The Soviets have responded saying that Finland made the right decision to avoid war. The Soviets have said that this will bring a greater cooperation between Finland and the USSR. This, however, didn't go unnoticed in the world, and NATO has responded saying this intrudes on Finnish independence. Could be a change in Scandinavia?"
 news.1502.a: "Will this Note Crisis grow?"
 news.1502.b: "A great ally has been made."
 news.1502.c: "This breaks the violation of Finnish independence."

 news.1503.t: "[GetNewspaperHeader]In Defense of Finland"
 news.1503.d: "The Finnish Government has come to a conclusion after a quick meeting a couple hours of the Soviet troops crossing the border. They have said Soviet 'Protection' is impending on their independence as a nation. The Finnish Army has decided to defend their country to the last man. There have already been reports of fighting around Eastern Finland. A 2nd Winter War has broke out. Who will win this time?"
 news.1503.a: "Who will win the 2nd Winter War?"
 news.1503.b: "We will support Finnish independence anyway necessary."
 news.1503.c: "Finland will be under us soon enough. We will make right of what we did wrong in the Winter War."
 news.1503.e: "We will defend our country to the last man!"
 
 news.1504.t: "[GetNewspaperHeader]2nd Winter War Breaks Out!"
 news.1504.d: "The Soviet Union has launched attacks into Finland. Soviet paratroopers were seen dropping into towns and cities around Finland. Columns of Soviet tanks and soldiers have been reported crossing into Finnish borders. The Finnish Army has opened fire onto the Soviets and reports of fighting has broke out. There has been countless Finnish refugees seen crossing into the Swedish and Norwegian borders trying to flee the fighting. NATO has not yet made a statement, but a 2nd Winter War has broken out between Finland and the USSR."
 news.1504.a: "Another Winter War? Who will win?"
 news.1504.b: "We will liberate Finland from the oppressive government there!"
 news.1504.c: "We will aid Finland anyway possible."
 news.1504.e: "We will stand united against the Red Hordes!"
 
 news.1505.t: "[GetNewspaperHeader]Finnish Democratic Republic Formed!"
 news.1505.d: "The Republic of Finland has decided to turn to a more left Finnish Democratic Republic. The Soviets have seen this as a way of the revolution once again spreading into Europe. The West have claimed this as the lost of an important ally in the Northern Europe region. Refugees have been seen crossing into the Swedish and Norwegian borders trying to flee from what they call 'Communist Tyranny.' The capital of Helsinki has been seen full of celebrations of the new Communist government."
 news.1505.a: "What will happen now?"
 news.1505.b: "We welcome our new friends into friendship!"
 news.1505.c: "We have lost a great ally in the region."
 news.1505.e: "We shall help the Revolution!"
 
 news.1506.t: "[GetNewspaperHeader]Finnish SSR Formed!"
 news.1506.d: "The Republic of Finland has decided to be allowed into the very selective group of the Soviet Socialist Republics. The Soviets have seen this as a way of the revolution once again spreading into Europe. The West have claimed this as the lost of an important ally in the Northern Europe region. Refugees have been seen crossing into the Swedish and Norwegian borders trying to leave the 'Red Invaders'. The capital of Helsinki has been seen full of celebrations of the new SSR."
 news.1506.a: "What will happen now?"
 news.1506.b: "We welcome our new friends into friendship!"
 news.1506.c: "We have lost a great ally in the region."
 news.1506.e: "We shall help the Revolution!"
 
 news.1507.t: "[GetNewspaperHeader]Civil War in Finland"
 news.1507.d: "A civil war has broken out the Republic of Finland and the Finnish Democratic Republic. The Communist Finnish have launched several attacks on Democratic Finnish troops. The Finnish Government have said that they will put down this rebellion against them. The Soviets have said that they will aid the Finnish Democratic Republic. NATO has stated that any help will be available for the Finnish Republic."
 news.1507.a: "What will happen now?"
 news.1507.b: "We will aid our revolutionaries in Finland!"
 news.1507.c: "We must contain Communism!"
 news.1507.e: "We will put down this rebellion!"
 
 news.1508.t: "[GetNewspaperHeader]Finland Annexed into the USSR"
 news.1508.d: "The Republic of Finland has decided to join the USSR and being annexed into them. The Soviets have stated that this is a great way for the eternal friendship between the Finnish and Soviet peoples. The West have said that this has made Northern Europe that more important due to them losing a ally in the region. Refugees have been seen crossing into the Swedish and Norwegian borders trying to avoid the 'Reds and their Tyranny'. The capital of Helsinki has been seen full of celebrations with the Soviets."
 news.1508.a: "What will happen now?"
 news.1508.b: "We have been reunited with a great ally!"
 news.1508.c: "We have lost a great ally in the region."
 
 news.1509.t: "[GetNewspaperHeader]End of the Note Crisis"
 news.1509.d: "The Note Crisis has come to an end. Both sides have agreed on what would happened to Finland and the Northern Europe region. Both NATO and Warsaw Pact governments have stated that they wished for peace and are glad the Note Crisis is over with. Hopefully peace shall come back and no more crises."
 news.1509.a: "May peace be in our lifetime."
 
 news.1510.t: "[GetNewspaperHeader]The Great Chilean Quake"
 news.1510.d: "Dubbed the 'Great Chilean Quake,' the United States Geological Survey has documented this catastrophe as the largest earthquake ever recorded by mankind so far. Documented on May 22, 1960, the 'Great Chilean Quake' was recorded to be with a magnitude of 9.5 causing a tsunami spanning from Chile to Asia. The Aftermath of the quake left 2,000,000 people homeless and jobless. The Tsunami itself swept through much of Chile, New Zealand, The Philippines, Japan, Peru, Ecuador, California and many other island territories which are being disputed by foreign powers to this day. Argentina and Bolivia were also devastated from the quake in nearby regions touching Chile. The damage brought by the Earthquake is estimated to be paid from $400 to $800 million dollars."

 mccarthy.1.d: "Wisconsin Republican Joseph R. McCarthy won the election to the Senate in 1946, during a campaign marked by anticommunist Red-baiting. Partially in response to Republican Party victories, President Harry S. Truman tried to demonstrate his own concern about the threat of Communism, by setting up a loyalty program for federal employees. He also asked the Justice Department to compile an official list of 78 subversive organizations. As the midterm election year got underway, former State Department official Alger Hiss, suspected of espionage, was convicted of perjury. In a speech at Wheeling, West Virginia, McCarthy mounted an attack on Truman's foreign policy agenda, stating that the State Department and its Secretary, Dean Acheson, harbored \"traitorous\" Communists. Advance copies of the speech distributed to the press record the number of Communists McCarthy claimed to have known as 205. Later revised, both in a letter to President Truman and in an \"official\" transcript of the speech that McCarthy submitted to the Congressional Record ten days later, he uses the number 57."
 
 MZB.2.d: "For years Mozambique has tried every means possible to free themselves from Portuguese colonial rule. Now, they have entered into a violent conflict against the Portuguese, with FRELIMO being the main force behind this. In addition to independence, FRELIMO's goal is to bring about social reform and eliminate a ruling elite."
 
 ire.1.d: "The KLM Flight 633 has crashed immediately after takeoff from Shannon Airport while en route from Amsterdam to New York City. The Super Constellation Triton ditched on a mudbank in the River Shannon with 28 people reported killed in the accident."
 
 raj.1.t: "Kashmir Conflict"
 raj.1.d: "The conflict with Pakistan over the state of Kashmir has increased tensions significantly between our countries. Pakistani aggressiveness is reaching new heights and if they are not stopped soon they may declare war. Shall we make a preemptive strike and end this matter once and for all?"
 raj.1.a: "We must strike first!"
 raj.1.b: "No, we can settle this diplomatically."
 raj.2.t: "India Declares War!"
 raj.2.d: "India has declared war on us! They cite the Kashmir conflict as their casus belli. They have launched massive airstrikes and are now treading on our sacred ground! Shall we strike back at the traitors?"
 raj.2.a: "Counterattack!"
 raj.5.t: "Referendum for Pondicherry"
 raj.5.d: "India and France, following talks, issued a joint statement on October 13, 1954 announcing a procedure for deciding the status of the French settlements. Five days later, on 18 October 1954 the elected members of the Representative Assembly and the municipal councilors of Pondicherry and Karaikkal took part in a referendum at Kizhur. Of the 178 members voting, an overwhelming majority of 170 members favored the merger of French Indian territories with the Republic of India. Three days later, an agreement on the de facto transfer of the French territories to India was signed in New Delhi between the two countries."
 raj.5.a: "Great!"
 raj.6.t: "Referendum for Pondicherry"
 raj.6.d.: "India and France, following talks, issued a joint statement on October 13, 1954 announcing a procedure for deciding the status of the French settlements. Five days later, on 18 October 1954 the elected members of the Representative Assembly and the municipal councilors of Pondicherry and Karaikkal took part in a referendum at Kizhur. Of the 178 members voting, an overwhelming majority of 170 members favored the merger of French Indian territories with the Republic of India. Three days later, an agreement on the de facto transfer of the French territories to India was signed in New Delhi between the two countries."
 raj.6.a: "It's a shame they didn't vote for us."
 raj.7.t: "Demand Goa"
 raj.7.d: "For years we have been trying to peacefully take back Goa from the hands of their imperial oppressors but to no avail. Goa has been part of India for thousands of years and for Portugal to claim that it is an integral part of their country is just absurd. Portugal has been staunchly holding onto their colonies in Africa and all over the world for years after the great war, and it seems like they have no intention of letting any of them go. It appears that our peaceful attempts have failed and we might have to resort to more violent means..."
 raj.7.a: "Goa is Indian! Launch Operation Vijay!"
 raj.7.b: "We will settle this diplomatically, end of story."
 raj.8.t: "War with India!"
 raj.8.d: "Prime Minister! India has savagely declared war on us! They claim that Goa is Indian territory while we know that it is Portuguese! We have strengthened our military forces in Portuguese Goa, however, the Indians outnumber us severely. Shall we send reinforcements?"
 raj.8.a: "Yes! Send reinforcements in now!"
 pak.1.t: "Kashmir Conflict"
 pak.1.d: "The conflict with India over the state of Kashmir has increased tensions significantly between our countries. Indian aggressiveness is reaching new heights and if they are not stopped soon they may declare war. Shall we make a preemptive strike and end this matter once and for all?"
 pak.1.a: "We must strike first!"
 pak.1.b: "No, we can settle this diplomatically."
 pak.2.t: "Pakistan Declares War!"
 pak.2.d: "Pakistan has declared war on us! They cite the Kashmir conflict as their casus belli. They have launched massive airstrikes and are now treading on our sacred ground! Shall we strike back at the traitors?"
 pak.2.a: "Counterattack!"
 news.500.t: "[GetNewspaperHeader]Kashmir Conflict"
 news.500.d: "India has declared war on Pakistan! They cite the Kashmir conflict as their casus belli. They have launched massive airstrikes and are now invading both East and West Pakistan. The fate of Kashmir remains uncertain."
 news.500.a: "Hopefully they could have settled their differences peacefully..."
 news.501.t: "[GetNewspaperHeader]Kashmir Conflict"
 news.501.d: "Pakistan has declared war on India! They cite the Kashmir conflict as their casus belli. They have launched massive airstrikes and are now invading India. The fate of Kashmir remains uncertain."
 news.501.a: "Hopefully they could have settled their differences peacefully..."
 news.502.t: "[GetNewspaperHeader]War for Goa!"
 news.502.d: "India has declared war on Portugal! They say that Goa is rightfully part of India, and not Portugal. India is currently invading Portuguese India with overwhelming force."
 news.502.a: "An Interesting Development."
 swe.2.d: "The 13th of June 1952, an unarmed Swedish naval aircraft, known as Tp 47 "Catalinan", was shot down by a Soviet MiG-15 outside of Gotland after it had been searching for another Swedish aircraft that had gone missing on the Baltic Sea. This led to many Swedes protesting outside of the Soviet embassy in Sweden. Four years later, Nikita Khrushchev confessed to Swedish Prime Minister Tage Erlander that the Soviets had shot down the plane. The Swedish government decided to keep this secret, though, and it was not until 1991 that this information was spread to the public, this after a former Soviet colonel admitted to the public that he had ordered it to get shot down. It is believed that this happened because of the fact that Swedish airplanes had repeatedly violated Soviet airspace and secretly taken photos of Soviet ships which they then sent to NATO."
 news.1513.t: "[GetNewspaperHeader]Death of Jimi Hendrix"
 news.1513.d: "Famous guitarist Jimi Hendrix has died at age 27. The exact nature of the death is still vague, and a coroner's inquest is to be held in London September 30th. Police however say it was a drug overdose. They say he took nine sleeping pills and died of suffocation through vomit. For some days prior to his death, Hendrix had been in poor health, in part from fatigue caused by overwork, a chronic lack of sleep, and an assumed influenza-related illness. Insecurities about his personal relationships, as well as disillusionment with the music industry, had also contributed to his frustration. Although the details of his final hours and death are disputed, Hendrix spent much of his last day alive with Monika Dannemann. In the morning hours, Dannemann found Hendrix unresponsive in her apartment at the Samarkand Hotel. She called for an ambulance at 11:18 a.m., and Hendrix was taken to St Mary Abbot's Hospital where an attempt was made to resuscitate him. He was pronounced dead at 12:45 p.m."
 news.1513.a: "The story of life is quicker than the wink of an eye"
 news.1514.t: "[GetNewspaperHeader]Marilyn Monroe Dies; Pills Blamed"
 news.1514.d: "Marilyn Monroe, a troubled beauty who failed to find happiness as Hollywood's brightest star, was discovered dead in her Brentwood home of an apparent overdose of sleeping pills.\nMonroe had suffered from mental illness and substance abuse for several years prior to her death, and she had not completed a film since 1961.\nMonroe spent the last day of her life at her home in Brentwood. At approximately 3 a.m., after appearing unresponsive her psychiatrist entered the room by breaking a window, and found Monroe dead.\nHer death was officially ruled a probable suicide, based on precedents of her overdosing and being prone to mood swings and suicidal ideation. No evidence of foul play was found, and accidental overdose was ruled out due to the large amount of barbiturates she had ingested.\nShe was a major sex symbol and one of the most popular Hollywood stars during the 1950s and early 1960s. She was a top-billed actress for a decade, and her films had grossed $200 million by the time of her death."
 news.1514.a: "Another victim for Hollywood"
 saf_news.2.d: "A Historically significant address has just been made by the British Prime Minister Harold Macmillan whilst addressing the South African Parliament in Cape Town during his tour of African Commonwealth states. He had been on tour of Africa since 6 January, visiting Ghana, Nigeria, and other British colonies in Africa. The speech signaled clearly that the Conservative-led UK Government had no intention to block the independence to many of these territories. Macmillan's Cape Town speech also made it clear that Macmillan included South Africa in his comments and indicated a shift in British policy in regard to apartheid"
 news.1515.t: "[GetNewspaperHeader]Israel Invades the Sinai"
 news.1515.d: "Earlier this morning, advance elements of Israel's IDF have entered the Egyptian owned Sinai desert and are steadily moving towards the recently nationalized Suez Canal. Israeli leadership is stating that the cause of the war is directly tied to Egyptian Premiere Nasser's strong and repeated threat to close the Straits of Tiran, and in light of his decision to seize the canal, Israel had no choice but to strike back in self defense. So far the international community has been somewhat silent on this unexpected development, although reports and rumors state that top British and French Diplomats are already hammering out a ceasefire proposal."
 news.1515.a: "How will this play out?"
 news.1516.t: "[GetNewspaperHeader]Suez Canal Seized"
 news.1516.d: "As the sun rose over Egypt this morning, elite forces of the Egyptian Army raced into the Suez Canal and quickly seized it, while [EGY.GetLeader] simultaneously made a triumphant speech to his people declaring the Canal rightfully Egyptian and that it was now theirs once again. While masses all over the Arab world flooded the streets to celebrate this great victory over the old imperialist powers, top diplomats and politicians all over Europe are scrambling to find some sort of reaction and figure out how this will impact their respective countries. It remains to be seen just how long Nasser will be able to hold on to his new territory."
 news.1516.a: "Interesting"
 news.1517.t: "[GetNewspaperHeader]British Troops land in Suez"
 news.1517.d: "It seems that the chain reaction stemming from Egypt's nationalization of the Suez Canal isn't quite finished, as today both Britain and France joined Israel in carrying out military action against the country. British Airborne Units landed in and around Port Said and quickly pushed back the few Egyptian brigades in the town, while the French met were met with similar success at Port Faud. However, they were not able to keep the Canal clear of blockage, as Egyptian forces sunk a few large tankers in the middle of the passage before the Anglo-French coalition could stop them. Thus, while the British have achieved a great military victory, the incoming oil shortage which will affect all of Europe seems to be of much greater import."
 news.1517.a: "Better get that gas now!"
 news.1518.t: "[GetNewspaperHeader]UN Resolutions 997 & 1001"
 news.1518.d: "When the British and French invaded Egypt in conjunction with Israel, they had hoped that at the very least the international community would sit by and let the situation unfold. However, the opposite has occurred, as the United States was at the head of an international outrage against the Anglo-French-Israeli operation. Today, that outrage has culminated with the United Nations passing 2 resolutions that demand an immediate end to the conflict and the handing over of the canal to a UN peacekeeping force. While the Tripartite Pact seemed to be successful militarily, it is clear that the Suez Crisis has been no less than a political disaster, with heavy repercussions for all 3 countries."
 news.1518.a: "At least it didn't cause World War III"
 news.1519.t: "[GetNewspaperHeader]Egyptian Victory"
 news.1519.d: "Much to the shock of most of the international community, today [EGY.GetLeader] has proclaimed military victory over the Tripartite Pact of Britain, France, and Israel. Despite the early stages of the conflict for the Sinai and Suez Canal showing Egypt to be on the retreat, nevertheless its army was able to recover and push Israel out of the Sinai, effectively ending any chance of success for the Tripartite Pact. Details of the ceasefire negotiations are still unclear, but it seems likely that Nasser will demand some form of reparations and of course, keep the canal under Egyptian control."
 news.1519.a: "The underdogs came out on top!"
 news.1520.t: "[GetNewspaperHeader]Nasser Accepts British Ceasefire"
 news.1520.d: "Earlier today [EGY.GetLeader] accepted a British-led ceasefire deal following a quick affirmative Israeli response to the proposal. The move came as a surprise to many Middle East Policy experts, as Nasser isn't known to cede on anything so lightly. Nevertheless, all hostilities in the Sinai have stopped, and British soldiers have moved to reclaim the canal under the terms of the deal. It is left up to the imagination what may have occurred instead if Nasser rejected the proposal, and for now, there is once again peace in the Middle East"
 news.1520.a: "This seems slightly... Underwhelming"

