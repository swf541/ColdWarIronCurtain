l_english:
 # ============================================================
 # CWIC scripted diplomatic actions.
 #
 # NAMING, THE THING THAT BIT US: a scripted diplomatic action does NOT read
 # its own key as a loc key. The engine looks up <ACTION_KEY IN CAPITALS>_TITLE
 # for the button and <ACTION_KEY IN CAPITALS>_ACTION_DESC for the tooltip.
 # Lowercase keys render as the raw uppercase token in the panel.
 #
 # Everything here is paid for in Political Power. The engine writes the price
 # into the button itself, so these strings only say what the action DOES.
 # ============================================================

 # ---------- Embargo (the action names live in custom_trade_stuff / __UNSORTED) ----------
 embargo_target_receive:0 "They have closed their markets to us."
 embargo_lifted_target_receive:0 "They have reopened their markets to us."

 # ---------- Effect feedback ----------
 EMBARGO_IMPOSED_TT:0 "§RTrade with [This.GetNameWithFlag] is cut off.§! Every export contract we hold with them is torn up."
 EMBARGO_LIFTED_TT:0 "§GOur markets are open to [This.GetNameWithFlag] again.§!"
 MIL_COOP_GRANTED_TT:0 "§GWe may now transit [This.GetNameWithFlag]'s territory, berth in their ports and fly from their airfields.§!"
 MIL_COOP_REVOKED_TT:0 "§ROur forces leave [This.GetNameWithFlag]'s territory, ports and airfields.§!"

 # ---------- Relation descriptions missing from our replaced diplomacy file ----------
 # CWIC's localisation/english/diplomacy_l_english.yml fully REPLACES vanilla's,
 # and it dropped 24 relation strings on the way. Without these the diplomacy
 # panel shows raw keys like `air_base_access_initiator_desc`, which is what made
 # the embargo look like it had not fired at all.
 embargo_initiator_desc:0 "$COUNTRY|H$ is embargoing other countries"
 embargo_initiator_extended_desc:0 "$COUNTRY1|Y$ is embargoing $COUNTRY2|Y$"
 embargo_receiver_desc:0 "$COUNTRY|H$ is embargoed by other countries"
 embargo_receiver_extended_desc:0 "$COUNTRY2|Y$ is embargoed by $COUNTRY1|Y$"
 air_base_access_initiator_desc:0 "$COUNTRY|UY$ has air base access to other nations"
 air_base_access_initiator_extended_desc:0 "$COUNTRY1|UY$ has air base access to $COUNTRY2|Y$"
 air_base_access_receiver_desc:0 "$COUNTRY|UY$ gives air base access to other nations"
 air_base_access_receiver_extended_desc:0 "$COUNTRY1|UY$ has air base access to $COUNTRY2|Y$"
 offer_air_base_access_initiator_desc:0 "$COUNTRY|UY$ gives air base access to other nations"
 offer_air_base_access_initiator_extended_desc:0 "$COUNTRY1|UY$ gives air base access to $COUNTRY2|Y$"
 offer_air_base_access_receiver_desc:0 "$COUNTRY|UY$ has air base access to other nations"
 offer_air_base_access_receiver_extended_desc:0 "$COUNTRY2|UY$ has air base access to $COUNTRY1|Y$"
 demilitarized_zone_initiator_desc:0 "$COUNTRY|UY$ has demilitarized zone"
 demilitarized_zone_initiator_extended_desc:0 "$COUNTRY1|UY$ has Demilitarized Zone enforced by $COUNTRY2|Y$:"
 demilitarized_zone_receiver_desc:0 "$COUNTRY|UY$ is enforcing Demilitarized Zone"
 demilitarized_zone_receiver_extended_desc:0 "$COUNTRY2|UY$ is enforcing Demilitarized Zone in $COUNTRY1|Y$:"
 war_reparation_initiator_desc:0 "$COUNTRY|UY$ transfers civilian factories as war reparation"
 war_reparation_receiver_desc:0 "$COUNTRY|UY$ receives civilian factories as war reparation"
 resource_rights_initiator_desc:0 "$COUNTRY|UY$ transfers resource rights"
 resource_rights_initiator_extended_desc:0 "$COUNTRY1|UY$ transfers resource rights to $COUNTRY2|Y$:"
 resource_rights_receiver_desc:0 "$COUNTRY|UY$ receives resource rights"
 resource_rights_receiver_extended_desc:0 "$COUNTRY2|UY$ receives resource rights to $COUNTRY1|Y$:"

 # ---------- Military Cooperation Accord ----------
 OPT_MILITARY_COOPERATION_ACTION_TITLE:0 "Military Cooperation Accord"
 OPT_MILITARY_COOPERATION_ACTION_ACTION_DESC:0 "One signature for all of it: our troops may cross their soil, our fleets may use their ports, our aircraft may fly from their fields.\n\nNobody in this era signs for transit and then refuses the airbase."
 MIL_COOP_NO_ACCESS_TT:0 "We have no accord with §Y[This.GetNameWithFlag]§!."
 MIL_COOP_HAS_ACCESS_TT:0 "§Y[This.GetNameWithFlag]§! currently hosts our forces under an accord."
 mil_coop_send:0 "Ask [This.GetNameWithFlag] to open their territory, ports and airfields to our forces?"
 mil_coop_receive:0 "[From.GetNameWithFlag] asks to base troops on our soil, berth in our ports and fly from our airfields.\n\nIt is one accord. There is no half of it."
 mil_coop_accept:0 "Accord Signed"
 mil_coop_accept_desc:0 "[This.GetNameWithFlag] opens their territory to us. Our forces may transit, berth and fly from it."
 mil_coop_reject:0 "Accord Refused"
 mil_coop_reject_desc:0 "[This.GetNameWithFlag] will not have our forces on their soil."
 mil_coop_acceptance:0 "Willingness to host our forces"

 OPT_REVOKE_MILITARY_COOPERATION_ACTION_TITLE:0 "End Military Cooperation"
 OPT_REVOKE_MILITARY_COOPERATION_ACTION_ACTION_DESC:0 "Close our territory to them. Their troops leave, their ships sail, their aircraft go home."
 mil_coop_revoke_send:0 "Close our territory, ports and airfields to [This.GetNameWithFlag]?"
 mil_coop_revoke_receive:0 "[From.GetNameWithFlag] has closed their territory to our forces."

 # ---------- Defence Commitment ----------
 OPT_DEFENCE_COMMITMENT_ACTION_TITLE:0 "Defence Commitment"
 OPT_DEFENCE_COMMITMENT_ACTION_ACTION_DESC:0 "We put our name to their survival.\n\nThis is §Rnot§! a guarantee and it will §Rnot§! drag us into their war. It is the standing licence that lets us §Gsend volunteers§! and §Glend-lease equipment§! to them — the way this war is actually fought.\n\nFor the promise that does pull us in, use Guarantee Independence."
 DEFENCE_COMMITMENT_NONE_TT:0 "We have no standing commitment to §Y[This.GetNameWithFlag]§!."
 DEFENCE_COMMITMENT_HAS_TT:0 "We have a standing commitment to §Y[This.GetNameWithFlag]§!."
 DEFENCE_COMMITMENT_LICENCE_TT:0 "§GWe may send volunteers to [This.GetNameWithFlag] from now on.§!"
 DEFENCE_COMMITMENT_REVOKE_TT:0 "§RWe may no longer send volunteers to [This.GetNameWithFlag].§!"
 defence_commitment_send:0 "Put our name to the defence of [This.GetNameWithFlag]?"
 defence_commitment_receive:0 "[From.GetNameWithFlag] offers to stand behind us.\n\nNot their armies — their volunteers and their equipment. And the attention of everyone who counts them an enemy."
 defence_commitment_accept:0 "Commitment Accepted"
 defence_commitment_accept_desc:0 "[This.GetNameWithFlag] accepts our protection. Our volunteers may reach them."
 defence_commitment_reject:0 "Commitment Refused"
 defence_commitment_reject_desc:0 "[This.GetNameWithFlag] would rather stand alone than stand behind us."
 defence_commitment_acceptance:0 "Willingness to accept our protection"

 OPT_REVOKE_DEFENCE_COMMITMENT_ACTION_TITLE:0 "Withdraw Defence Commitment"
 OPT_REVOKE_DEFENCE_COMMITMENT_ACTION_ACTION_DESC:0 "Take our name off their survival. The volunteer licence goes with it — and so does a little of what our word is worth."
 defence_commitment_revoke_send:0 "Withdraw our commitment to [This.GetNameWithFlag]? Our volunteers will no longer be able to reach them."
 defence_commitment_revoke_receive:0 "[From.GetNameWithFlag] has withdrawn their commitment to our defence."

 # ---------- Recall Volunteers ----------
 # RECALL_VOLUNTEERS_TITLE / _ACTION_DESC already live in diplomacy_l_english.yml.
 recall_volunteers_acceptance:0 "Willingness to let our people go home"

 # ---------- Removed actions (backstop tooltips) ----------
 LICENSING_REMOVED_TT:0 "§RLicensed production is not used in the Cold War.§! Equipment moves by lend-lease and by purchase."
 EXP_FORCE_REMOVED_TT:0 "§RExpeditionary forces are not used in CWIC.§! Our allies already join our wars; volunteers cover everything else."

 # ---------- Embargo map mode ----------
 # A scripted map mode's loc key is not documented anywhere reliable, so all
 # the plausible spellings are here. An unused loc key costs nothing; a missing
 # one shows the raw token on the button.
 MAPMODE_EMBARGO_MAP_MODE:0 "Embargoes"
 MAPMODE_EMBARGO_MAP_MODE_NAME:0 "Embargoes"
 MAPMODE_EMBARGO_MAP_MODE_DESCRIPTION:0 "Who we have cut off, and who has cut us off."
 MAPMODE_EMBARGO_MAP_MODE_TOOLTIP:0 "Who we have cut off, and who has cut us off."
 embargo_map_mode:0 "Embargoes"
 embargo_map_mode_tooltip:0 "§EDeep red§!: embargoing each other.\n§OOrange§!: we are embargoing them.\n§YYellow§!: they are embargoing us.\nGrey: no trade quarrel."
