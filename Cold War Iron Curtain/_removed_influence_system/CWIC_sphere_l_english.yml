l_english:
 # ---- Accord / membership ideas ----
 sph_econ_accord_idea:0 "Economic Accord"
 sph_econ_accord_idea_desc:0 "This nation has signed an economic accord with a Great Power, opening its markets."
 sph_mil_accord_idea:0 "Military Accord"
 sph_mil_accord_idea_desc:0 "This nation has signed a military accord with a Great Power, aligning its armed forces."
 sphere_member_trade:0 "Sphere Market Access"
 sphere_member_trade_desc:0 "This nation is in a foreign sphere of influence, granting its leader privileged access to its market."
 sph_diplomatic_initiative:0 "Diplomatic Initiative"
 sph_diplomatic_initiative_desc:0 "A concerted diplomatic push is boosting the influence we project abroad. §Y+50% Foreign Influence Gain§! while active."
 sph_strategic_value_template:0 "Strategic Value (template)"
 sph_strategic_value_template_desc:0 "Template only — never applied. Copy its modifier into a country's real spirit to raise how strongly Great Powers want to influence it."
 # ---- Opinion modifiers ----
 sph_econ_accord_op:0 "Economic Accord"
 sph_mil_accord_op:0 "Military Accord"
 sph_sphere_member:0 "Sphere Leader"
 sph_sphere_ripper:0 "Tore a Nation from Our Sphere"
 # ---- Stage names (rename freely — one place) ----
 sph_stage_0_txt:0 "None"
 sph_stage_1_txt:0 "§GEconomic Accord§!"
 sph_stage_2_txt:0 "§GMilitary Accord§!"
 sph_stage_sphered_txt:0 "§YIn Our Sphere§!"
 # ---- Status ----
 sph_status_idle:0 "§gNot influencing§!"
 sph_status_influencing:0 "§GInfluencing§!"
 sph_status_sphered:0 "§YSphered§!"
 sph_readout_TT:0 "Your influence over this nation (0-100), gained weekly while influencing (uses a slot).\nAt §Y50§!: sign the §GEconomic Accord§!, then the §GMilitary Accord§! (each spends 50).\nWith the Military Accord and §Y100§! influence you can §YAdd to Sphere§!."
 # ---- Diplomatic actions (HOI4 auto-keys, uppercase) ----
 OPT_SPHERE_INFLUENCE_TITLE:0 "Influence Nation"
 OPT_SPHERE_INFLUENCE_ACTION_DESC:0 "Spend one influence slot to start influencing this nation. Influence rises a flat amount every week (0-100)."
 OPT_SPHERE_STOP_TITLE:0 "Stop Influencing"
 OPT_SPHERE_STOP_ACTION_DESC:0 "Stop influencing this nation and free the slot. Progress is kept."
 OPT_SPHERE_ECON_ACCORD_TITLE:0 "Sign Economic Accord"
 OPT_SPHERE_ECON_ACCORD_ACTION_DESC:0 "Spend §Y50§! influence to sign an economic accord — the first step toward bringing this nation into your sphere.\nIncludes a full §YTrade Agreement§! — no separate action needed."
 OPT_SPHERE_MIL_ACCORD_TITLE:0 "Sign Military Accord"
 OPT_SPHERE_MIL_ACCORD_ACTION_DESC:0 "Spend §Y50§! influence to sign a military accord. Requires the Economic Accord.\nGrants mutual §YGuarantees§!, §YMilitary Access§!, §YDocking Rights§! and §YAir Base Access§! — replaces the separate access requests and the Mutual Defense Agreement."
 OPT_SPHERE_ADD_TO_SPHERE_TITLE:0 "Add to Sphere"
 OPT_SPHERE_ADD_TO_SPHERE_ACTION_DESC:0 "Bring this nation into your sphere of influence. Requires the §GMilitary Accord§! and §Y100§! influence.\nMembership includes §YMilitary Subsidies§! and privileged market access."
 OPT_SPHERE_RELEASE_TITLE:0 "Remove from Rival Sphere"
 OPT_SPHERE_RELEASE_ACTION_DESC:0 "Spend §Y100§! influence to tear this nation out of a rival power's sphere of influence."
 # ---- Send popups / tooltips ----
 sph_dip_influence_send:0 "Start influencing [THIS.GetName]? This uses one influence slot."
 sph_dip_stop_send:0 "Stop influencing [THIS.GetName] and free the slot? Current influence ([?THIS.sph_disp_score|0]) is kept."
 sph_dip_econ_accord_send:0 "Sign an §GEconomic Accord§! with [THIS.GetName]? Spends §Y50§! influence."
 sph_dip_mil_accord_send:0 "Sign a §GMilitary Accord§! with [THIS.GetName]? Spends §Y50§! influence."
 sph_dip_add_to_sphere_send:0 "Bring [THIS.GetName] into your sphere of influence? Spends §Y100§! influence."
 sph_dip_release_send:0 "Tear [THIS.GetName] out of its current sphere of influence? Spends §Y100§! influence."
 sph_dip_generic_receive:0 "[FROM.GetName] adjusts its influence over your nation."
 sph_dip_need_slot_TT:0 "You have no free influence slots. Stop influencing another nation first."
 # ---- Discredit ----
 OPT_SPHERE_DISCREDIT_TITLE:0 "Discredit Rival"
 OPT_SPHERE_DISCREDIT_ACTION_DESC:0 "Spend §Y25§! of your influence to undermine the strongest rival power's standing here, reducing their influence by §R40§!."
 sph_dip_discredit_send:0 "Discredit the leading rival power in [THIS.GetName]? Spends §Y25§! of your influence to remove §R40§! of theirs."
 sph_readout_rival_TT:0 "The strongest rival Great Power's influence over this nation. Use §YDiscredit Rival§! to set them back."
 sph_open_list_TT:0 "§YForeign Influence§!\nShow every Great Power currently influencing this nation, their influence (0-100), and how close each is."
 sph_list_empty_TT:0 "§gNo Great Power is influencing this nation.§!"
 sph_leader_none_txt:0 "§gNone§!"
 sph_readout_influence_line:0 "Influence: §Y[?sph_disp_score|0]§!/100"
 sph_readout_slots_line:0 "Your slots: §Y[?ROOT.sph_active_ids^num|0]§!/[?ROOT.sph_slots|0]"
 sph_readout_slots_TT:0 "§YInfluence Slots§!\nHow many nations you can influence at once (used / total). Total = 2 base + the §YInfluence Slots§! modifier from your national spirits."
 sph_readout_gp_line:0 "Influencing §Y[?sph_active_ids^num|0]§!/[?sph_slots|0] nations"
 sph_readout_gp_label:0 "§YInfluence Slots§!"
 sph_readout_gp_TT:0 "§YInfluence Slots§!\nHow many nations this Great Power can influence at once, and how many it is currently using. Click the magnifier to see which nations."
 sph_open_gp_list_TT:0 "Show every nation this Great Power is currently influencing."
 sph_gp_list_title_txt:0 "§YNations They Influence§!"
 sph_gp_list_empty_TT:0 "§gThis power is not influencing anyone.§!"
 sph_my_influence_txt:0 "§Y[?sph_query_influence|0]§!/100"
 # ---- Rip notification event ----
 cwic_sphere.1.t:0 "[sph_news_target.GetName] Torn From Our Sphere"
 cwic_sphere.1.d:0 "Through years of patient diplomacy and pressure, [sph_news_ripper.GetName] has pried [sph_news_target.GetName] out of our sphere of influence. Our accords with [sph_news_target.GetName] are void, and our standing in the region has suffered a humiliating blow."
 cwic_sphere.1.a:0 "This insult will not be forgotten."

 # --- content grants & flavour ---
 sph_influence_gain_tt:0 "[sph_tt_gp.GetFlag] §YInfluence§! of [sph_tt_gp.GetNameDefCap] in [THIS.GetNameDefCap]: §Y[?sph_amount|0+]§! points"
 sph_national_resolve:0 "National Resolve"
 sph_national_resolve_desc:0 "Our course was set at home, not in a foreign embassy. Envoys bearing gifts will find the door harder to open for some years yet."

 # --- influence panel ---
 sph_list_title_txt:0 "Foreign Influence Here"
 sph_list_header_txt:0 "§GPOWER§!                    §GINFLUENCE§!      §GSTANDING§!"
 sph_list_blocked_txt:0 "§RIdeologically incompatible§! — no accords possible."
 sph_list_blocked_TT:0 "Accords cannot be signed across the Iron Curtain. A Marxist state will not take Western guarantees, and Washington will not underwrite a communist government.\n\nThis bar lifts if either side is granted an exception — Belgrade, Cairo and Bucharest all played both sides in their day."

 # --- ideology gates on the diplomatic actions ---
 sph_tt_econ_ideology:0 "Our economic systems are compatible"
 sph_tt_mil_ideology:0 "Our systems are compatible, and they answer to no rival power"

 # --- notifications ---
 cwic_sphere.2.t:0 "Influence Shifts in [sph_news_target.GetNameDefCap]"
 cwic_sphere.2.d:0 "[GetSphNewsLine]\n\nOur own position in [sph_news_target.GetNameDefCap] is unchanged for now, but the ground is moving. If we intend to hold what we have there, it will not hold itself."
 cwic_sphere.2.a:0 "Keep the embassy informed."
 sph_news_econ:0 "[sph_news_actor.GetFlag] [sph_news_actor.GetNameDefCap] has signed an §YEconomic Accord§! with [sph_news_target.GetNameDefCap]."
 sph_news_mil:0 "[sph_news_actor.GetFlag] [sph_news_actor.GetNameDefCap] has signed a §YMilitary Accord§! with [sph_news_target.GetNameDefCap] — basing rights and guarantees included."
 sph_news_sphered:0 "[sph_news_actor.GetFlag] [sph_news_actor.GetNameDefCap] has brought [sph_news_target.GetNameDefCap] into its §Ysphere of influence§!."
 sph_news_lost:0 "[sph_news_actor.GetFlag] [sph_news_actor.GetNameDefCap] has §Rlost standing§! in [sph_news_target.GetNameDefCap] — an accord there has lapsed."
 sph_news_torn:0 "[sph_news_actor.GetFlag] [sph_news_actor.GetNameDefCap] has §Rtorn [sph_news_target.GetNameDefCap] out§! of the sphere it belonged to."
 sph_news_generic:0 "The balance of influence in [sph_news_target.GetNameDefCap] has shifted."

 cwic_sphere.3.t:0 "We Join the [sph_news_actor.GetNameDefCap] Sphere"
 cwic_sphere.3.d:0 "The agreements are signed. [sph_news_actor.GetNameDefCap] now stands behind our economy and our security, and in return our markets and our foreign policy will follow theirs.\n\nThere are those at home who call this protection, and those who call it a leash."
 cwic_sphere.3.a:0 "The terms are acceptable."

 cwic_sphere.4.t:0 "Our Patron Demands an Embargo"
 cwic_sphere.4.d:0 "[sph_news_actor.GetFlag] [sph_news_actor.GetNameDefCap], as leader of our sphere, has closed its trade with [sph_news_target.GetNameDefCap] — and expects us to do the same. Our customs houses have been instructed accordingly.\n\nMembership has its obligations."
 cwic_sphere.4.a:0 "Comply."

 cwic_sphere.5.t:0 "A Decision in [sph_patron_subject.GetNameDefCap]"
 cwic_sphere.5.d:0 "Events in [sph_patron_subject.GetNameDefCap] have reached the point where the outcome is still open — and we have spent years building the standing to be heard there.\n\nOur ambassador reports that a word from us now would carry weight. It would also spend a great deal of what we have built."
 cwic_sphere.5.a:0 "Put our thumb on the scale."
 cwic_sphere.5.a.tt:0 "Spends §R25§! influence in [sph_patron_subject.GetNameDefCap]"
 cwic_sphere.5.b:0 "This is their affair."

 # --- embargo map mode ---
 MAPMODE_EMBARGO_MAP_MODE:0 "Embargoes"
 MAPMODE_EMBARGO_MAP_MODE_NAME:0 "Embargoes"
 MAPMODE_EMBARGO_MAP_MODE_DESCRIPTION:0 "Who we have closed our trade to, and who has closed theirs to us."
 embargo_map_mode_tooltip:0 "§OOrange§!: we embargo them\n§YYellow§!: they embargo us\n§RDeep red§!: mutual\n§BPurple§!: embargoing us on their patron's orders"

